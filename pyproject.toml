[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socharness"
version = "0.0.1"
description = "SoC Labs Harness Manager: board manager for SoC prototyping harnesses (MPS3 pilot)."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary (SoC Labs), pending decision" }
# The shell control-channel codec is pyverify (mps3-nanosoc-platform/host/pyverify).
# It is the ONLY implementation of net-protocol.md on the host. Never re-implement it here.
dependencies = [
    "mps3-pyverify>=0.1.0",
    # socharnessd + the web UI (Wave 2): all pure pip wheels on Linux/Windows/macOS.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    # signed update channel (minisign / Ed25519)
    "cryptography>=42",
    # boards.toml (T9) on Python 3.10; 3.11+ has tomllib
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
# a USB INA260 on the 12 V input (T9): board power where there is no metered plug
ina260 = ["EasyMCP2221>=1.7"]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "pyserial>=3.5",
]
# `socharness app` in a native window (WebView2 / WKWebView / GTK-Qt WebKit); without it,
# the app opens a Chrome/Edge/Chromium app window
app = ["pywebview>=5"]
# browser tests for the web UI (T14): drives the system Chrome, no browser download
webtest = ["playwright>=1.40"]

[project.scripts]
socharness = "socharness.cli.main:main"

# Board packs register here. The MPS3 pack is in-tree for now and will split
# out as socharness-board-mps3 once its interface has settled.
[project.entry-points."socharness.boards"]
mps3 = "socharness_board_mps3.pack:Mps3Pack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"socharness.web" = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "scenario_*.py"]
timeout = 60
markers = [
    "hil: hardware-in-the-loop; needs SOCHARNESS_HIL=1, a board address, and david's board window",
    "slow: long-running integration scenario",
]
addopts = "-m 'not hil'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
