# swd_cortex_m.cfg — full Cortex-M0 target over the MPS3 SWD stack.
#
# Layers on swd_remote_bitbang.cfg (the bare SW-DP + remote_bitbang transport to
# TCP 6920) by creating a cortex_m target on the DAP, so `halt`/`reg`/`mdw`/
# `resume` work. Bare-DAP DPIDR first-light needs only swd_remote_bitbang.cfg;
# this adds the target for debug (halt/step/memory).
#
# HW-PROVEN 2026-07-10 against nanoSoC on shell 0xAAF21306:
#   SWD DPIDR 0x0bb11477 ; Cortex-M0 r0p0 detected ; halt -> pc 0x378 (remapped
#   IMEM, i.e. the app is running past the bootrom->IMEM handoff) ; CPUID
#   0x410cc200. OpenOCD runs ON the fpgahub host (the board dataplane
#   192.168.10.101:6920 is only reachable there). The swap must have reached
#   DONE (swd ungated) — a failed/mid swap leaves swd gated and 6920 is dropped
#   on connect (fixed for the failure case in swap_fsm 15c05df).
#
# Usage (from the hub):
#   openocd -f swd_remote_bitbang.cfg -f swd_cortex_m.cfg \
#           -c "init" -c "halt" -c "reg pc" -c "resume" -c "shutdown"
target create nanosoc.cpu cortex_m -dap nanosoc.dap
