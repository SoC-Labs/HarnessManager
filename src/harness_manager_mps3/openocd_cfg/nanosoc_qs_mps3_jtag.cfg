# nanosoc_qs_mps3_jtag.cfg -- OpenOCD for rm_nanosoc_qs v3 (design 0x000B): the
# Quickstart nanoSoC whose CORTEXM0DAP is built as a JTAG-DP (JTAGnSW = 1).
# Same transport as nanosoc_mps3_jtag.cfg (remote_bitbang to the harness's
# jtag_server, TCP 6921, which bit-bangs TCK/TMS/TDI and samples TDO through
# jtag_bb), so stock OpenOCD works with NO proxy. Differences from rm_nanosoc:
#   - the TAP is the Cortex-M0 JTAG-DP, IDCODE 0x0BA01477 (not SoC-400's
#     0x6BA00477); DPIDR 0x0BB11477; one AHB-AP (IDR 0x04770021) at AP 0;
#   - _CHIPNAME stays "nanosoc" so nanosoc_ops.tcl (nanosoc_halt_examine) and the
#     designs.conf attach hook work unchanged.
# On the board (mps3-debug): RBB_HOST 127.0.0.1. From a PC: an `ssh -L` to the
# claimed board's 127.0.0.1:6921, and RBB_HOST/RBB_PORT set to the local end.
# Proven in RTL simulation at the partition pins (tb_rm_jtag.sv); NOT yet on silicon.
if { ![info exists RBB_HOST] } { set RBB_HOST 127.0.0.1 }
if { ![info exists RBB_PORT] } { set RBB_PORT 6921 }
adapter driver remote_bitbang
remote_bitbang host $RBB_HOST
remote_bitbang port $RBB_PORT
transport select jtag
adapter speed 1000
# srst would reset the whole RM (DAP included: nTRST follows the DP power-on
# reset), so reset the core through SYSRESETREQ instead.
reset_config none
set _CHIPNAME nanosoc
set _DAP_TAPID 0x0ba01477
jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_DAP_TAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu0 cortex_m -dap $_CHIPNAME.dap -ap-num 0 -defer-examine
$_CHIPNAME.cpu0 cortex_m reset_config sysresetreq
targets $_CHIPNAME.cpu0
echo "nanosoc_qs_mps3_jtag.cfg: rm_nanosoc_qs (0x000B) JTAG-DP TAPID $_DAP_TAPID via $RBB_HOST:$RBB_PORT"
