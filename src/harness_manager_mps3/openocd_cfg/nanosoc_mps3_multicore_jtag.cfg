#-----------------------------------------------------------------------------
# nanosoc_mps3_multicore_jtag.cfg -- OpenOCD for rm_nanosoc_multicore on the MPS3:
# ONE CoreSight SoC-400 SWJ-DP in JTAG mode, TWO AHB-APs (APSEL 0 = cpu0, 1 = cpu1).
#
# A joint work commissioned on behalf of SoC Labs, under Arm Academic Access
# license. Copyright (C) 2026, SoC Labs (www.soclabs.org)
#-----------------------------------------------------------------------------
# CPU0 BOOT GATE (v2.2 fix, lane MCDBG 2026-10-14): CPU0/network_core powers up HELD IN
# RESET, debug included, until something sets CPU0_BOOTGATE (bit2 of chip_core_remap_ctrl,
# 0x29000000, write-1-set). CPU1's boot ROM sets it only after a good flash boot table
# (stage0_bootrom_chip_core/main.c:380-383); the MPS3 flash has none, so CPU1 parks in its WFI
# halt() and CPU0's AP0 reads 0 -- board 1's "Cortex-M PARTNO 0x0 is unrecognized" (D6/D7,
# mint 4; v2.0.0 the same). nanosoc_halt_examine therefore releases the gate over AP1 first,
# exactly as the DUT's own proven pynq/scripts/openocd/cpu0_run_imem_bootgate.tcl:26-29 does.
# The single-core cfg (nanosoc_mps3_jtag.cfg) is untouched: this only runs for design 0x0003.
#
# UNPROVEN ON SILICON (written 2026-09-30 for the on-board GDB server, mps3-debug).
# It is nanosoc_mps3_jtag.cfg's front end (the same remote_bitbang seam onto the
# shell's jtag_server, 6921) with the DAP/target half of the proven multicore
# reference, nanosoc-multicore-system/pynq/scripts/openocd/nanosoc_multicore.cfg
# (SWD there, JTAG here: the SoC-400's JTAG-DP IDCODE is 0x6BA00477, the SW-DP's
# DPIDR 0x6BA02477 -- that file's header). What the first board session must check:
# the IDCODE, both APs answering, and a halt of each core.
#
# Two GDB servers: cpu0 on gdb_port, cpu1 on gdb_port+1 (3333/3334 by default);
# OpenOCD serves one per target with a register model, in declaration order.
#-----------------------------------------------------------------------------

# --- front-end selection (identical seam to nanosoc_mps3_jtag.cfg) -----------
if { ![info exists TRANSPORT_MODE] } { set TRANSPORT_MODE rbb }
if { ![info exists XVC_HOST] }       { set XVC_HOST 192.168.10.101 }
if { ![info exists XVC_PORT] }       { set XVC_PORT 2542 }
if { ![info exists RBB_HOST] }       { set RBB_HOST 192.168.10.101 }
if { ![info exists RBB_PORT] }       { set RBB_PORT 6921 }

switch -- $TRANSPORT_MODE {
    xvc {
        adapter driver xvc
        xvc host $XVC_HOST
        xvc port $XVC_PORT
    }
    rbb {
        adapter driver remote_bitbang
        remote_bitbang host $RBB_HOST
        remote_bitbang port $RBB_PORT
    }
    uio {
        # mps3_jtagbb: OpenOCD ON the Linux harness drives JTAGBB in-process through
        # its UIO mapping -- no socket, no harnessd in the bit path
        # (fpga/shell/ip/jtag_bb/sw/openocd/README.md). mps3-debug passes the locked
        # device, the DFXCTL interlock and its 6921 hold as inherited fds; run by hand
        # (root) the adapter finds "jtag-bb"/"dfxctl" and takes 6921 itself.
        adapter driver mps3_jtagbb
        if { [info exists UIO_SYSFS] } { mps3_jtagbb uio_sysfs $UIO_SYSFS }   ;# tests
        if { [info exists JTAGBB_FD] } { mps3_jtagbb device_fd $JTAGBB_FD }
        if { [info exists DFXCTL_FD] } { mps3_jtagbb interlock_fd $DFXCTL_FD }
        if { [info exists HOLD_FD] }   { mps3_jtagbb hold_fd $HOLD_FD }
        adapter speed 1000   ;# no stretch: TCK is bus-bound (~150-700 kHz), see the README
    }
    default { error "nanosoc_mps3_multicore_jtag.cfg: unknown TRANSPORT_MODE '$TRANSPORT_MODE' (expected xvc|rbb|uio)" }
}

transport select jtag

set _CHIPNAME nanosoc
if { ![info exists _DAP_TAPID] } { set _DAP_TAPID 0x6ba00477 }
jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_DAP_TAPID

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# -defer-examine on both cores: the AHBSLV=0 PPB mirror (nanosoc_mps3_jtag.cfg).
target create $_CHIPNAME.cpu0 cortex_m -dap $_CHIPNAME.dap -ap-num 0 -defer-examine
$_CHIPNAME.cpu0 cortex_m reset_config sysresetreq
target create $_CHIPNAME.cpu1 cortex_m -dap $_CHIPNAME.dap -ap-num 1 -defer-examine
$_CHIPNAME.cpu1 cortex_m reset_config sysresetreq

targets $_CHIPNAME.cpu0

# Release CPU0 from its boot gate: chip_core_remap_ctrl (0x29000000) bit2, written over AP1
# (CPU1's AP; the DAP master reaches the register from either AP, sys_desc
# nanosoc_multicore_soc.yaml dap_ss_0_m targets). Write-1-set, so it never clears REMAP (bit0)
# or anything CPU1's ROM set, and it is a no-op once CPU0 runs. The gate resets only on the
# SoC's power-on/system reset (the DUT reset or a swap), so it is re-applied on every attach.
# CPU0 then runs its stage-0 ROM, which waits for CPU1's XiP-WARM flag (never published here)
# in a read-only loop -- it does not touch the flash.
proc nanosoc_mc_release_cpu0 {} {
    nanosoc.dap apreg 1 0x00 0x23000002     ;# CSW: 32-bit, single, data access (the ref's)
    nanosoc.dap apreg 1 0x04 0x29000000     ;# TAR -> chip_core_remap_ctrl
    nanosoc.dap apreg 1 0x0C 0x00000004     ;# DRW: CPU0_BOOTGATE (W1S)
    nanosoc.dap apreg 1 0x04 0x29000000
    set rc [nanosoc.dap apreg 1 0x0C]
    if { ($rc & 0x4) == 0 } {
        echo [format "nanosoc_mc_release_cpu0: remap_ctrl 0x%08X, CPU0_BOOTGATE did not set" $rc]
    }
    sleep 30                                ;# reset_ctrl stretch + CPU0 PRMU (the ref waits 30 ms)
    return $rc
}

# Halt through the AP, then examine: the gdb-attach hooks mps3-debug installs.
proc nanosoc_halt_examine_ap {ap tgt} {
    # DHCSR = 0xE000EDF0 ; DBGKEY|C_DEBUGEN|C_HALT = 0xA05F0003
    nanosoc.dap apreg $ap 0x00 0x23000002   ;# CSW: 32-bit, single, data access (multicore_smoke_lib.tcl)
    nanosoc.dap apreg $ap 0x04 0xE000EDF0   ;# TAR -> DHCSR
    nanosoc.dap apreg $ap 0x0C 0xA05F0003   ;# DRW -> halt
    sleep 50                                ;# the ref's halt-to-examine gap (multicore_smoke.tcl:77)
    $tgt arp_examine
}

# The raw CSW/TAR/DRW sequences above must not interleave with OpenOCD's background poll of a
# core that is ALREADY examined on the same AP: the poll rewrites TAR (-> DHCSR) between two
# `apreg` commands, so the DRW write lands on DHCSR and the read returns DHCSR (seen on the
# model: attach cpu1 first, then cpu0 -> the AP1 release wrote DHCSR, CPU0 stayed gated).
# So both hooks run with background polling off, and always turn it back on (gdb needs it).
proc nanosoc_mc_unpolled {body} {
    poll off
    set rc [catch {uplevel 1 $body} msg opts]
    poll on
    return -options $opts $msg
}
proc nanosoc_halt_examine {} {
    nanosoc_mc_unpolled {
        nanosoc_mc_release_cpu0
        nanosoc_halt_examine_ap 0 nanosoc.cpu0
    }
    nanosoc.cpu0 arp_poll
}
proc nanosoc_halt_examine1 {} {
    nanosoc_mc_unpolled { nanosoc_halt_examine_ap 1 nanosoc.cpu1 }
    nanosoc.cpu1 arp_poll
}

echo "nanosoc_mps3_multicore_jtag.cfg: TRANSPORT_MODE=$TRANSPORT_MODE TAPID=$_DAP_TAPID (2 APs, CPU0 boot-gate release on attach; UNPROVEN on silicon)"
