# swd_remote_bitbang.cfg — OpenOCD front-end for the shell's SWD probe
# (docs/contracts/net-protocol.md v0.2 "SWD channel (TCP 6920)";
# ARCHITECTURE_SPEC.md §10.1, D10=v1 "dumb pin-wiggler").
#
# This is the file-form of exactly the argv that
# pyverify.debug.OpenOcdRemoteBitbangConfig.command() builds with -c
# directives (host/pyverify/pyverify/debug.py) — keep the two in sync.
#
# Usage (host/IP overridable without editing this file):
#
#   openocd -c "set SHELL_HOST 192.168.10.101" \
#           -f host/openocd/swd_remote_bitbang.cfg \
#           -c init -c shutdown
#
# DPIDR-read smoke test: `init` performs the SWD line reset + DP connect
# and reads DPIDR; success looks like
#
#   Info : SWD DPIDR 0x0bb11477
#
# in the log (0x0bb11477 = Arm Cortex-M0 SW-DP, the nanoSoC DUT — confirm
# the actual value at bring-up; any successful "SWD DPIDR" line means the
# shell's swd_server + bitbang engine and the DUT's DP are alive). Against
# a shell that is up but with no DUT loaded, expect the connect to fail
# *after* the TCP session opens — that still proves the 6920 transport.
#
# Requires OpenOCD >= the Jan-2021 remote_bitbang-SWD merge (spec §16);
# any 0.12.0+ release qualifies.

# ---- overridable knobs (set via -c "set NAME value" before -f) ----------
if { ![info exists SHELL_HOST] } {
    # Shell's default static IP (ARCHITECTURE_SPEC.md §3 / net-protocol.md).
    set SHELL_HOST 192.168.10.101
}
if { ![info exists SHELL_SWD_PORT] } {
    # net-protocol.md v0.2 port map: 6920 = SWD, OpenOCD remote_bitbang.
    set SHELL_SWD_PORT 6920
}

# ---- adapter: remote_bitbang over TCP to the shell ----------------------
adapter driver remote_bitbang
remote_bitbang host $SHELL_HOST
remote_bitbang port $SHELL_SWD_PORT

# Byte protocol (net-protocol.md v0.2): O=SWDIO drive, o=SWDIO release,
# c=sample SWDIO; d/e/f/g = {CLK,DIO} combos; r/s/t/u = trst/srst;
# B/b = LED; Q = quit. The CLK/DIO bit order must be confirmed against
# the shell firmware's bitbang engine at bring-up (spec §10.1).
transport select swd

# Advisory only: remote_bitbang has no clock-rate control (the TCP byte
# stream *is* the clock). Kept so this file and pyverify.debug's argv
# builder describe the same session.
adapter speed 1000

# srst mapping: the remote_bitbang r/s/t/u reset chars carry {trst,srst};
# the shell maps **srst onto dbg_resetn** (net-protocol.md v0.2 "SWD
# channel"; shell-regmap.md DFXCTL/reset fabric) — i.e. `reset halt`-style
# srst assertion resets the DUT's debug logic, not the whole shell. SWD
# has no TRST, so declare srst as the only reset line.
reset_config srst_only

# ---- target: minimal DAP, enough for the DPIDR smoke test ---------------
# The full nanosoc-on-MPS3 target cfg (cortex_m target create + memory
# map) doesn't exist yet — pyverify.debug names it target/nanosoc_mps3.cfg
# and flags its eventual home as an A6 open question (does it ship with
# the overlay manifest per-RM?). Until it lands, this bare DAP declaration
# is sufficient for `init` to line-reset, connect and read DPIDR.
swd newdap nanosoc cpu -enable
dap create nanosoc.dap -chain-position nanosoc.cpu
