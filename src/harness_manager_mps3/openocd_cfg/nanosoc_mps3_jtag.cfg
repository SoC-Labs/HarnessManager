#-----------------------------------------------------------------------------
# nanosoc_mps3_jtag.cfg — OpenOCD target for the MPS3 nanoSoC DUT over the
# axi_jtag DAP path (CoreSight SoC-400 SWJ-DP in JTAG mode).
#
# A joint work commissioned on behalf of SoC Labs, under Arm Academic Access
# license. Copyright (C) 2026, SoC Labs (www.soclabs.org)
#-----------------------------------------------------------------------------
# CARRIED ACROSS from the PROVEN reference
#   nanosoc-multicore-system/pynq/scripts/openocd/nanosoc_multicore.cfg
#   (kr260-axijtag-uart / haps-sx-axijtag-uart, silicon-proven).
# Everything from `dap create` down is the invariant, board-agnostic core and
# is lifted verbatim; only the front-end (transport + TAP + AP count) is MPS3
# glue. See docs/planning/AXIJTAG_UART_CARRY_ACROSS.md.
#
# TRANSPORT — the ONE honest open piece.
#   The reference drives axi_jtag from the KR260/haps host directly (PS mmap /
#   Vivado hw_axi); the axi_jtag register file is pragma-protect-encrypted and
#   there is NO committed OpenOCD-over-axi_jtag driver even upstream.
#   The KU115 has no PS, so on MPS3 axi_jtag must be fronted by a MicroBlaze
#   firmware XVC/JTAG server (the analogue of the SWD `swd_server` on 6920,
#   RETIRED since the SWD->JTAG cutover: no image serves 6920 now) OR by
#   Vivado's XVC debug-bridge server.
#
#   STATUS UPDATE (2026-07-30, commit a87d456): that server now EXISTS and is
#   SILICON-PROVEN. `firmware/jtag_server/` shipped first in the then-fielded
#   0xCD74B6AE shell and `TRANSPORT_MODE=rbb` drives a real M0 halt over TAP
#   0x6ba00477. The old "NOT runnable end-to-end" caveat above applied to the
#   xvc-over-axi_jtag path only and is retired for rbb.
#
#   DEFAULT FLIPPED TO rbb (2026-09-09). Until today the default below was `xvc`
#   while the paragraph directly above it said, in this file, that xvc is "NOT
#   the proven path" -- so every hand-run of this cfg took the unproven front-end
#   unless the operator had read to line 29 and passed an override. A default
#   that contradicts its own file's documentation is a trap, and the cost was
#   real: scripts/harness_gates/swd_check.py was still pointed at the dead
#   6920/SWD server partly because nothing here made the live path the obvious
#   one. xvc remains fully supported -- pass `-c "set TRANSPORT_MODE xvc"`.
#
#   Two supported front-ends, selected by TRANSPORT_MODE (default: rbb):
#     xvc  -> OpenOCD >=0.12 `xvc` driver -> tcp XVC server (fw xvc_server / hw_server)
#     rbb  -> OpenOCD `remote_bitbang` -> a fw jtag_server speaking the RBB JTAG
#             protocol (mirrors swd_remote_bitbang.cfg exactly)
#   Override on the CLI, e.g.:  -c "set XVC_HOST 192.168.10.101" -c "set XVC_PORT 2542"
#-----------------------------------------------------------------------------

# --- front-end selection ----------------------------------------------------
if { ![info exists TRANSPORT_MODE] } { set TRANSPORT_MODE rbb }   ;# rbb = the SILICON-PROVEN path (see header)
if { ![info exists XVC_HOST] }       { set XVC_HOST 192.168.10.101 }
if { ![info exists XVC_PORT] }       { set XVC_PORT 2542 }
if { ![info exists RBB_HOST] }       { set RBB_HOST 192.168.10.101 }
if { ![info exists RBB_PORT] }       { set RBB_PORT 6921 }   ;# fw jtag_server; net-protocol.md / MPS3_PORT_JTAG

switch -- $TRANSPORT_MODE {
    xvc {
        # Xilinx Virtual Cable — what axi_jtag natively presents. Needs OpenOCD
        # >= 0.12 (the generic `xvc` adapter). The server is a fw XVC bridge onto
        # the axi_jtag AXI-Lite window (MPS3 base 0x44AF_0000) or Vivado hw_server.
        adapter driver xvc
        xvc host $XVC_HOST
        xvc port $XVC_PORT
    }
    rbb {
        # remote_bitbang — the fw jtag_server (TCP 6921) bit-bangs TCK/TMS/TDI/
        # TDO through the shell's jtag_bb block (JTAGBB @0x44A7_0000), not an
        # axi_jtag window. Same shape as host/openocd/swd_remote_bitbang.cfg.
        adapter driver remote_bitbang
        remote_bitbang host $RBB_HOST
        remote_bitbang port $RBB_PORT
    }
    default { error "nanosoc_mps3_jtag.cfg: unknown TRANSPORT_MODE '$TRANSPORT_MODE' (expected xvc|rbb)" }
}

# --- transport + TAP (MPS3 glue) --------------------------------------------
# JTAG, NOT SWD: axi_jtag drives the SWJ-DP in JTAG mode (4 wires tck/tms/tdi/tdo).
transport select jtag

# MPS3 delta vs the reference: the JTAG TAP IDCODE is 0x6ba00477 (the JTAG-DP /
# Cortex-M0 r0p0 TAP, hardware-verified on this DUT), NOT the SWD DPIDR
# 0x0bb11477 the SWD path (swd_cortex_m.cfg) expects.
set _CHIPNAME nanosoc
set _DAP_TAPID 0x6ba00477
jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_DAP_TAPID

# ==== INVARIANT CORE (lifted verbatim from the proven reference) ============
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# MPS3 DUT is a SINGLE Cortex-M0 -> one AHB-AP at APSEL=0 (the reference is a
# 2-CPU multicore with APSEL 0/1; MPS3 uses only AP 0).
#
# -defer-examine: with AHBSLV=0 in CORTEXM0INTEGRATION, PPB reads while the core
# runs mirror the IFETCH stream instead of the requested register, so OpenOCD's
# auto-examine reads a bogus CPUID and chokes ("Cortex-M CPUID ... unrecognized").
# Defer examination; the caller halts the core via raw `dap apreg` (CSW/TAR/DRW
# writes to DHCSR) BEFORE `arp_examine`. See the reference multicore_smoke.tcl.
target create $_CHIPNAME.cpu0 cortex_m -dap $_CHIPNAME.dap -ap-num 0 -defer-examine
$_CHIPNAME.cpu0 cortex_m reset_config sysresetreq

targets $_CHIPNAME.cpu0
# ============================================================================

# Convenience: halt-via-apreg then examine (the AHBSLV=0 workaround, single-AP).
proc nanosoc_halt_examine {} {
    # DHCSR = 0xE000EDF0 ; DBGKEY|C_DEBUGEN|C_HALT = 0xA05F0003
    nanosoc.dap apreg 0 0x00 0x22000012   ;# CSW: 32-bit, addr-inc off, DbgSwEnable
    nanosoc.dap apreg 0 0x04 0xE000EDF0   ;# TAR -> DHCSR
    nanosoc.dap apreg 0 0x0C 0xA05F0003   ;# DRW -> halt
    nanosoc.cpu0 arp_examine
    nanosoc.cpu0 arp_poll
}

echo "nanosoc_mps3_jtag.cfg: TRANSPORT_MODE=$TRANSPORT_MODE TAPID=$_DAP_TAPID (single AP, cortex_m0)"
echo "  rbb: fw jtag_server on $RBB_HOST:$RBB_PORT (BUILT + silicon-proven, a87d456)."
echo "  xvc: needs an XVC bridge fronting axi_jtag\@0x44AF_0000 -- NOT proven end to end."
echo "       See docs/planning/AXIJTAG_UART_CARRY_ACROSS.md."
