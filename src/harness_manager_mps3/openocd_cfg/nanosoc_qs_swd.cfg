# nanosoc_qs_swd.cfg -- OpenOCD for rm_nanosoc_qs (the Quickstart-only nanoSoC).
#
# The RM's debug port is the Cortex-M0's own CORTEXM0DAP, a SW-DP (DPIDR
# 0x0BB11477), reached over the partition's four jtag_* pins read as SWD
# (fpga/rp/nanosoc_qs/README.md). The fielded shell's jtag_server (6921) speaks
# only the JTAG half of remote_bitbang, so OpenOCD talks SWD to the local byte
# re-speller, which forwards JTAG-form bytes to the board:
#
#   python3 host/openocd/swd_over_jtagbb_proxy.py --board 192.168.10.101 &
#   openocd -f host/openocd/nanosoc_qs_swd.cfg
#
# UNPROVEN ON SILICON (2026-09-23): the path is proven in RTL simulation only
# (proxy + jtag_bb + RM glue + Quickstart CORTEXM0DAP read DPIDR 0x0BB11477).
if { ![info exists PROXY_HOST] } { set PROXY_HOST 127.0.0.1 }
if { ![info exists PROXY_PORT] } { set PROXY_PORT 6920 }

adapter driver remote_bitbang
remote_bitbang host $PROXY_HOST
remote_bitbang port $PROXY_PORT
transport select swd
adapter speed 1000

# srst (-> CLKRST.dbg_resetn) resets the whole chip INCLUDING the SW-DP on this
# RM (one nrst_i; PORESETn feeds DPRESETn in slcorem0), so reset through the
# core instead.
reset_config none

swd newdap nanosoc_qs cpu -enable -expected-id 0x0BB11477
dap create nanosoc_qs.dap -chain-position nanosoc_qs.cpu
target create nanosoc_qs.cpu0 cortex_m -dap nanosoc_qs.dap
nanosoc_qs.cpu0 cortex_m reset_config sysresetreq
