#-----------------------------------------------------------------------------
# nanosoc_iice_chain.cfg — OpenOCD for the IICE RM, whose reconfigurable
# partition carries TWO TAPs on the ONE set of jtag_* partition pins.
#
# A joint work commissioned on behalf of SoC Labs, under Arm Academic Access
# license. Copyright (C) 2026, SoC Labs (www.soclabs.org)
#-----------------------------------------------------------------------------
# USE THIS ONLY FOR THE IICE RM. Every other RM (rm_nanosoc, rm_nanosoc_upy,
# rm_nanosoc_multicore, ...) has ONE TAP on those pins and wants
# host/openocd/nanosoc_mps3_jtag.cfg, which is deliberately left untouched. A
# two-TAP config pointed at a one-TAP RM finds the wrong number of devices; a
# one-TAP config pointed at THIS RM matches the first IDCODE and then reports a
# device after the end of the chain (see "WHY THIS ORDER", point 2).
#
# WHY A CHAIN AT ALL
#   fpga/rp/nanosoc_iice's soft Identify TAP used to ride the four swd_*
#   partition pins on its own. The A6 SWD->JTAG cutover deleted that group, and
#   the one debug wire-set the fielded boundary has (fpga/shell/boundary.yaml,
#   group `jtag`) is already carrying the DUT's CoreSight SoC-400 SWJ-DP. So the
#   RM daisy-chains them instead of muxing them, and BOTH are live at once.
#   Design note: docs/planning/IICE_JTAG_CHAIN.md.
#
# THE PHYSICAL CHAIN (fpga/rp/nanosoc_iice/rp_nanosoc_iice_shim.sv, default
# IICE_TAP_NEAREST_TDI = 1):
#
#     shell TDI -> [Identify soft TAP] -> [SoC-400 SWJ-DP] -> shell TDO
#
# WHY THIS ORDER, AND WHY THE DECLARATIONS BELOW ARE IN THE OPPOSITE ORDER
#   OpenOCD's FIRST-declared `jtag newtap` is the TAP NEAREST TDO. That is not
#   folklore -- jtag_tap_add() appends to the tap-list tail (src/jtag/core.c:213),
#   the list is walked head-first into fields[] (src/jtag/drivers/driver.c:152),
#   jtag_build_buffer() lays fields into the wire buffer from bit 0
#   (src/jtag/commands.c:215) and bitbang.c shifts buffer bit 0 out first
#   (src/jtag/drivers/bitbang.c:215); the user guide states it by worked example
#   in doc/openocd.texi:13861-13895 ("JTAG TAP Order").
#
#   1. Declaring the DAP first keeps it at chain position 0, exactly where
#      nanosoc_mps3_jtag.cfg:80 has it, so `dap create -chain-position`,
#      `target create ... -ap-num 0` and every `nanosoc.dap apreg` line in
#      host/openocd/nanosoc_ops.tcl carry across with no edit.
#   2. It also makes the legacy single-TAP config fail LEGIBLY against this RM:
#      the first 32 IDCODE bits are the DAP's, so OpenOCD matches 0x6BA00477 and
#      then complains about an extra device -- naming the real problem. Reversed,
#      it would report "nanosoc.cpu UNEXPECTED: 0x1063E4CD" and send the reader
#      to debug a DAP that is fine.
#   3. And it leaves the RM's jtag_tdo output driven by the DAP's TDO alone,
#      structurally identical to the silicon-proven rm_nanosoc.
#
# PROVEN IN SIMULATION: tests/jtag_chain (VCS) drives this exact chain through
# the real shim -- both IDCODEs in these positions, total IR length 9, a
# Cortex-M0 halt to DHCSR.S_HALT through the DAP with the Identify TAP in
# BYPASS, and an Identify-TAP register shift with the DAP in BYPASS. Its
# controls are the swapped declaration order and the legacy single-TAP scan;
# both fail, as they must.
#-----------------------------------------------------------------------------

# --- front-end selection (identical seam to nanosoc_mps3_jtag.cfg) -----------
if { ![info exists TRANSPORT_MODE] } { set TRANSPORT_MODE rbb }
if { ![info exists XVC_HOST] }       { set XVC_HOST 192.168.10.101 }
if { ![info exists XVC_PORT] }       { set XVC_PORT 2542 }
if { ![info exists RBB_HOST] }       { set RBB_HOST 192.168.10.101 }
if { ![info exists RBB_PORT] }       { set RBB_PORT 6921 }   ;# fw jtag_server

switch -- $TRANSPORT_MODE {
    xvc {
        adapter driver xvc
        xvc host $XVC_HOST
        xvc port $XVC_PORT
    }
    rbb {
        adapter driver remote_bitbang
        remote_bitbang host $RBB_HOST
        remote_bitbang port $RBB_PORT
    }
    default { error "nanosoc_iice_chain.cfg: unknown TRANSPORT_MODE '$TRANSPORT_MODE' (expected xvc|rbb)" }
}

transport select jtag

# --- TCK CEILING -------------------------------------------------------------
# The chain runs at the speed of its SLOWEST TAP, and that is the Identify one:
# the instrumentor auto-constrains its soft TAP to a 250 ns period with the
# comment "The JTAG clock in the instrumentation logic need only run at 4 MHz"
# ($SYNPLIFY_HOME/lib/share/synthesis/syn.sdc). The SWJ-DP is happy far faster,
# but it is behind the same wires.
#
# In practice the shell's firmware bit-bang is orders of magnitude slower than
# this (3 AXI accesses per JTAG bit through jtag_bb @ 0x44A7_0000), so the cap
# below never binds on the rbb path -- it is here so that a future hardware
# shifter, or an `adapter speed` typed at the console, cannot silently
# overclock the instrumentation logic. Overclocking a soft TAP does not error;
# it returns garbage scans.
adapter speed 4000

# --- the chain, declared NEAREST TDO FIRST ----------------------------------
set _CHIPNAME nanosoc

# [0] the DUT's CoreSight SoC-400 SWJ-DP. Hardware-verified TAP IDCODE on this
#     DUT; NOT the SWD DPIDR 0x0bb11477 (an SW-DP concept).
set _DAP_TAPID 0x6ba00477
jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_DAP_TAPID

# [1] the Synopsys Identify soft TAP inside the RM. IR length and IDCODE are
#     read off Identify's OWN device table, which is plain Tcl and is the table
#     the debugger uses for chain auto-detection:
#
#       .../SFPGA_2022.09-SP2/identify/lib/share/contrib/syn_idcodes.tcl:741-742
#         # Synopsys Soft JTAG
#         idcode add -quiet 00010000011000111110010011001101 SoftJTAG 5 \
#             -family soft-jtag
#
#     `idcode add` takes <idcode binary, MSB first> <name> <IR width>
#     (identify_debug_env_reference.pdf p.46), so IR = 5 and IDCODE =
#     0b0001_0000_0110_0011_1110_0100_1100_1101 = 0x1063e4cd.
#
#     -ircapture/-irmask are left at OpenOCD's IEEE defaults (0x01 / 0x03,
#     src/jtag/tcl.c:411-412). The soft TAP's IR-capture constant could not be
#     read out of the vendor-obfuscated jtag_interface_core.v, so this is the
#     one value here that is a STANDARDS ASSUMPTION rather than a measurement.
#     If OpenOCD reports "IR capture error", add explicit -ircapture/-irmask
#     rather than deleting the check.
set _IICE_TAPID 0x1063e4cd
jtag newtap $_CHIPNAME iice -irlen 5 -expected-id $_IICE_TAPID

# ==== INVARIANT CORE (identical to nanosoc_mps3_jtag.cfg from here down) =====
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# Single Cortex-M0 -> one AHB-AP at APSEL 0.
#
# -defer-examine: with AHBSLV=0 in CORTEXM0INTEGRATION, PPB reads while the core
# runs mirror the IFETCH stream instead of the requested register, so OpenOCD's
# auto-examine reads a bogus CPUID and chokes. Defer examination; halt the core
# via raw `dap apreg` BEFORE `arp_examine`.
target create $_CHIPNAME.cpu0 cortex_m -dap $_CHIPNAME.dap -ap-num 0 -defer-examine
$_CHIPNAME.cpu0 cortex_m reset_config sysresetreq

targets $_CHIPNAME.cpu0
# ============================================================================

# Convenience: halt-via-apreg then examine (the AHBSLV=0 workaround, single-AP).
proc nanosoc_halt_examine {} {
    # DHCSR = 0xE000EDF0 ; DBGKEY|C_DEBUGEN|C_HALT = 0xA05F0003
    nanosoc.dap apreg 0 0x00 0x22000012   ;# CSW: 32-bit, addr-inc off, DbgSwEnable
    nanosoc.dap apreg 0 0x04 0xE000EDF0   ;# TAR -> DHCSR
    nanosoc.dap apreg 0 0x0C 0xA05F0003   ;# DRW -> halt
    nanosoc.cpu0 arp_examine
    nanosoc.cpu0 arp_poll
}

# After ANY DUT reset, RE-RUN THE DP POWER-UP before touching the AP.
#
# MEASURED in tests/jtag_chain (test_dut_reset_drops_the_debug_powerup), and it
# is not the failure people expect. The RM ties the SWJ-DP's `npotrst` to the
# DUT's system reset (rp_nanosoc_wrapper.sv:527). Pulsing dut_resetn therefore
# clears CTRL/STAT's CDBGPWRUPREQ/CSYSPWRUPREQ -- but it does NOT reset the TAP
# controller or the IR, because those sit behind `ntrst`, which the RM straps
# high. So the chain keeps scanning perfectly, both IDCODEs still read back, and
# every AP access silently returns nothing useful. It looks like a deaf DAP, not
# like a reset. OpenOCD's own `dap init`/`arp_examine` path re-runs the power-up;
# this proc is here for scripts that drive `dap apreg` directly.
proc nanosoc_repower {} {
    nanosoc.dap dpreg 0x04 0x50000000     ;# CTRL/STAT: CSYSPWRUPREQ|CDBGPWRUPREQ
    nanosoc.dap dpreg 0x04                ;# read back; expect 0xF0000000-ish
}

echo "nanosoc_iice_chain.cfg: TRANSPORT_MODE=$TRANSPORT_MODE  2-TAP CHAIN"
echo "  chain (nearest TDO first): $_CHIPNAME.cpu SWJ-DP irlen 4 id $_DAP_TAPID"
echo "                             $_CHIPNAME.iice Identify soft TAP irlen 5 id $_IICE_TAPID"
echo "  physical order: TDI -> Identify -> SWJ-DP -> TDO   (total IR 9)"
echo "  `scan_chain` prints the taps in declaration order; use it to verify."
echo "  For a NON-instrumented RM use host/openocd/nanosoc_mps3_jtag.cfg instead."
