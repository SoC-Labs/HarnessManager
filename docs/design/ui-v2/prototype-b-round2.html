<title>HM Workbench</title>

  --lcd-banner: #2f5bd3;

  --proto-bg: #22262e;
  --proto-fg: #f4f5f7;
  --proto-2: #a9b1bd;
  --proto-line: #3b424e;
  /* B2-WORKBENCH: sidebar board cards (outline, rest fill, selected) */
  --rc-bg: #f7f8fa;
  --rc-line: #d6dae1;

}

    --proto-bg: #e4e7ec;

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans);
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; }
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }
.icon { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }
.icon.sm { width: 14px; height: 14px; vertical-align: -2px; }
.muted { color: var(--text-3); }
.secondary { color: var(--text-2); }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }

/* --- prototype bar (not part of HM) ------------------------------------------------------ */
.proto-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  height: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px);
  padding-left: 16px; padding-right: 12px;
  background: var(--proto-bg); color: var(--proto-fg); display: flex; align-items: center; gap: 12px;
  font-size: 12.5px; border-bottom: 1px solid var(--proto-line);
}
.proto-name { font-weight: 600; white-space: nowrap; letter-spacing: 0.01em; }
.proto-tag {
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  border: 1px solid var(--proto-line); border-radius: 4px; padding: 1px 6px; color: var(--proto-2);
}
.proto-idea { color: var(--proto-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.proto-btn {
  height: 24px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--proto-line);
  background: transparent; color: var(--proto-fg); cursor: pointer; font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.proto-btn:hover { border-color: var(--proto-2); }
.proto-btn .icon { width: 14px; height: 14px; }

/* --- app layout --------------------------------------------------------------------------- */
.app {
  position: fixed; top: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr);
}
.rail { background: var(--rail); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.brand-name { font-weight: 600; font-size: 14px; line-height: 1.2; }
.brand-sub { font-size: 12px; color: var(--text-3); line-height: 1.2; }
.rail-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 6px; }
.rail-title { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
.rail-tools { display: flex; gap: 2px; }
.rail-hub { padding: 0 18px 6px; font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; min-width: 0; }
.rail-hub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-list { list-style: none; margin: 0; padding: 2px 10px 12px; overflow-y: auto; flex: 1; min-height: 0; }
.rail-card { position: relative; margin-bottom: 8px; }
.rail-group-title {
  list-style: none; display: flex; align-items: center; gap: 6px; padding: 8px 6px 4px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3);
}
.board-item {
  display: block; width: 100%; text-align: left; background: var(--rc-bg); border: 1px solid var(--rc-line);
  border-radius: 9px; padding: 9px 36px 9px 12px; cursor: pointer; color: inherit; transition: border-color .12s, background-color .12s;
}
.board-item:hover { background: var(--rc-sel-bg); border-color: var(--rc-line-hover); }
.board-item[aria-current="true"] { background: var(--rc-sel-bg); border-color: var(--rc-sel-line); box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
.board-row1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.board-name { font-weight: 600; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-label {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-2); border: 1px solid var(--border-strong);
  border-radius: 4px; padding: 0 5px; line-height: 16px; white-space: nowrap; background: var(--surface-2);
}
.board-row2 { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); margin-top: 6px; padding-left: 16px; min-width: 0; }
.board-row2 .icon { color: var(--text-3); }
.board-row2 .dsg { font-family: var(--font-mono); font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.board-row2 .knd { color: var(--text-3); white-space: nowrap; }
.board-row3 { display: flex; gap: 6px; align-items: center; margin-top: 4px; padding-left: 16px; color: var(--text-3); font-size: 11.5px; min-width: 0; }
.board-row3 > span:not(.usb-tag) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.board-lease { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; padding-left: 16px; min-width: 0; }
.board-lease .chip { height: auto; min-height: 20px; font-size: 11.5px; padding: 2px 7px; max-width: 100%; white-space: normal; line-height: 1.25; }
.board-lease .chip span { min-width: 0; overflow-wrap: anywhere; }
.open-chip { height: 19px !important; font-size: 11px !important; padding: 0 7px !important; margin-left: auto; }
.clash-mark { color: var(--warn); display: inline-flex; }
.clash-mark .icon { width: 14px; height: 14px; }
.rail-star {
  position: absolute; top: 7px; right: 5px; width: 26px; height: 26px; display: grid; place-items: center;
  padding: 0; border: 0; background: transparent; border-radius: var(--radius-sm); color: var(--text-3); cursor: pointer;
}
.rail-star.on { color: var(--accent); }
.rail-star.on .icon path { fill: currentColor; }
.rail-star:hover { background: var(--hover); }
.locate-rail { position: absolute; right: 6px; bottom: 8px; }
.locate-btn {
  height: 24px; min-width: 26px; padding: 0 4px; border: 1px solid transparent; background: transparent; border-radius: 6px;
  color: var(--text-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 3px;
}
.locate-btn:hover { background: var(--hover); color: var(--text-2); }
.locate-btn.blinking { color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent-border); }
.locate-count { font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-3); }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.err { background: var(--err); }
.dot.accent { background: var(--accent); }
.dot.held { background: var(--held); }
.rail-foot { border-top: 1px solid var(--border); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.foot-links { display: flex; gap: 2px; }
.foot-links .btn { flex: 1; padding: 0 6px; gap: 5px; position: relative; }
.foot-badge {
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 10.5px; font-weight: 600;
  display: inline-grid; place-items: center; background: var(--err); color: var(--on-badge);
}
.daemon-line { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-3); padding: 0 4px; }
.daemon-line span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button {
  border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12.5px;
  color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg button:disabled { opacity: 0.45; cursor: not-allowed; }
.rail .seg { width: 100%; }
.rail .seg button { flex: 1; justify-content: center; }

/* --- workspace ---------------------------------------------------------------------------- */
.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.mobile-top { display: none; }
.board-header { padding: 16px 28px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
.header-row1 { display: flex; align-items: flex-start; gap: 16px; }
.header-titles { flex: 1; min-width: 0; }
.header-title { font-size: 19px; font-weight: 600; line-height: 1.25; display: flex; align-items: center; gap: 10px; }
.header-sub { font-size: 12.5px; color: var(--text-2); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.header-sub .mono { color: var(--text-3); }
.header-actions { display: flex; align-items: center; gap: 8px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin: 12px 0 10px; font-size: 13px; }
.fact { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fact-label { color: var(--text-3); font-size: 12px; }
.fact-value { font-weight: 500; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fact-value .mono { font-weight: 400; color: var(--text-2); }
.lease-fact { padding: 3px 4px 3px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
.lease-fact .btn { height: 26px; }
.sections { display: flex; gap: 2px; margin: 0 -8px; overflow-x: auto; scrollbar-width: none; }
.sections::-webkit-scrollbar { display: none; }
.section-tab {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 10px 10px; color: var(--text-2);
  font-weight: 500; font-size: 13.5px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; border-radius: 0;
}
.section-tab:hover { color: var(--text); }
.section-tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.section-tab .badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; display: inline-grid; place-items: center;
  background: var(--err); color: var(--on-badge);
}
.section-tab .badge.warn { background: var(--warn); }
.section-tab .badge.run { background: var(--accent); }
.section-tab .new-tag { font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--accent-text); background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: 4px; padding: 0 4px; line-height: 15px; }
.section-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 20px 28px 28px; }
.section-body.fill { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 16px; }

/* --- cards, kv, chips ----------------------------------------------------------------------- */
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px 0; flex-wrap: wrap; }
.card-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-title .icon { color: var(--text-3); }
.card-head .spacer { flex: 1; }
.card-sub { color: var(--text-2); font-size: 12.5px; padding: 3px 16px 0; }
.card-body { padding: 12px 16px 16px; }
.card-body.flush { padding: 8px 0 4px; }
.kv { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 8px 14px; font-size: 13px; }
.kv dt { color: var(--text-3); font-size: 12.5px; padding-top: 1px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kv .sub { color: var(--text-3); font-size: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px;
  font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); line-height: 1; max-width: 100%;
}
.chip .icon { width: 13px; height: 13px; }
.chip.ok { background: var(--ok-soft); border-color: var(--ok-border); color: var(--ok); }
.chip.warn { background: var(--warn-soft); border-color: var(--warn-border); color: var(--warn); }
.chip.err { background: var(--err-soft); border-color: var(--err-border); color: var(--err); }
.chip.unk { background: var(--unk-soft); border: 1px dashed var(--unk-border); color: var(--unk); }
.chip.accent { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-text); }
.chip.held { background: var(--held-soft); border-color: var(--held-border); color: var(--held); }
.chip.plain { background: transparent; }
.chip.busy .icon { animation: spin 1s linear infinite; }
button.chip { cursor: pointer; font-family: inherit; }
button.chip:hover { filter: brightness(0.97); text-decoration: underline; }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 0 5px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); line-height: 17px; white-space: nowrap; }
.tag.ila { color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent-border); }
.tag.kit { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-border); }
.tag.now { color: var(--text); border-color: var(--border-strong); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.reason { display: flex; align-items: flex-start; gap: 6px; color: var(--text-2); font-size: 12.5px; line-height: 1.4; min-width: 0; }
.reason .icon { color: var(--text-3); margin-top: 1px; width: 14px; height: 14px; }
.reason.warn .icon { color: var(--warn); }
.reason.err .icon { color: var(--err); }
.reason.ok .icon { color: var(--ok); }
.reason.held, .reason.held .icon { color: var(--held); }
.reason.busy .icon { color: var(--accent); animation: spin 1s linear infinite; }
.reason span { min-width: 0; overflow-wrap: anywhere; }
.reason.flash { animation: flash 0.9s ease 2; border-radius: 4px; }
@keyframes flash { 50% { background: var(--warn-soft); } }

/* --- buttons and forms ---------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 13px;
  border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background-color .12s, border-color .12s;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--err); border-color: var(--err-border); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.release { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-text); font-weight: 600; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 12px; gap: 5px; }
.btn.icon-only { width: 30px; padding: 0; }
.btn[aria-disabled="true"], .btn[aria-disabled="true"]:hover {
  background: var(--surface-2); border-color: var(--border); color: var(--text-3); cursor: not-allowed;
}
.btn.ghost[aria-disabled="true"] { background: transparent; border-color: transparent; }
.btn[aria-busy="true"], .btn[aria-busy="true"]:hover { cursor: progress; background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-text); }
.btn[aria-busy="true"] .icon { animation: spin 1s linear infinite; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.input, .select {
  height: 32px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface);
  padding: 0 10px; font-size: 13px; min-width: 0;
}
.input.sm, .select.sm { height: 28px; font-size: 12.5px; }
.input.mono { font-family: var(--font-mono); font-size: 12.5px; }
.input::placeholder { color: var(--text-3); }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; line-height: 1.45; }
.field { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.field > label:first-child { color: var(--text-2); min-width: 96px; }
.arm-inline {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--surface-2); font-size: 12px; color: var(--text-2); cursor: pointer; white-space: nowrap; user-select: none;
}
.arm-inline.big { height: 32px; font-size: 12.5px; }
.arm-inline input { margin: 0; accent-color: var(--warn); }
.arm-inline .icon { width: 14px; height: 14px; color: var(--text-3); }
.arm-inline.armed { border-color: var(--warn-border); background: var(--warn-soft); color: var(--text); }
.arm-inline.armed .icon { color: var(--warn); }
.arm-inline.dis { opacity: .6; cursor: not-allowed; }
.arm-inline.pulse { animation: pulse 1.1s ease 3; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--warn-border); } }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.check input { margin: 0; accent-color: var(--accent); }
.copy-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.copy-row code {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--text);
}
.result {
  font-family: var(--font-mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text-2);
  max-height: 220px; overflow-y: auto;
}
.outcome {
  display: flex; align-items: flex-start; gap: 9px; padding: 8px 12px; border-radius: 8px; font-size: 13px;
  border: 1px solid var(--border); background: var(--surface-2); min-width: 0;
}
.outcome > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.outcome.ok { border-color: var(--ok-border); background: var(--ok-soft); }
.outcome.ok > .icon { color: var(--ok); }
.outcome.err { border-color: var(--err-border); background: var(--err-soft); }
.outcome.err > .icon { color: var(--err); }
.outcome.warn { border-color: var(--warn-border); background: var(--warn-soft); }
.outcome.warn > .icon { color: var(--warn); }
.outcome.info { border-color: var(--accent-border); background: var(--accent-soft); }
.outcome.info > .icon { color: var(--accent-text); }
.meter { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width .15s linear; }
.steps { display: flex; gap: 6px; }
.step { flex: 1; min-width: 0; font-size: 11.5px; color: var(--text-3); display: flex; flex-direction: column; gap: 4px; }
.step .bar { height: 4px; border-radius: 2px; background: var(--border); }
.step.done .bar { background: var(--ok); }
.step.active .bar { background: var(--accent); }
.step.active { color: var(--text); font-weight: 500; }
.step.done { color: var(--text-2); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-3); padding: 0 10px 7px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table th:first-child, .table td:first-child { padding-left: 16px; }
.table th:last-child, .table td:last-child { padding-right: 16px; }
.table .r { text-align: right; }
.table-wrap { overflow-x: auto; }

/* --- attention, tiles (Overview) ------------------------------------------------------------ */
.attention { border: 1px solid var(--warn-border); background: var(--warn-soft); border-radius: var(--radius); padding: 10px 14px 10px; }
.attention-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.attention-title .icon { color: var(--warn); }
.attention ul { list-style: none; margin: 0; padding: 0; }
.att { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--warn-border); font-size: 13px; }
.att:first-child { border-top: 0; }
.att.err > .icon { color: var(--err); }
.att.warn > .icon { color: var(--warn); }
.att-text { color: var(--text-2); overflow-wrap: anywhere; }
.att-text strong { color: var(--text); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.tile { display: flex; flex-direction: column; }
.tile .card-body { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.tile .tile-foot { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.big-value { font-size: 21px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.span-2 { grid-column: span 2; }
.panel-tile-body { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 18px; align-items: start; }

/* --- Workbench ------------------------------------------------------------------------------ */
.wb { display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 28vw, 420px); grid-template-rows: auto minmax(0, 1fr); gap: 14px; flex: 1; min-height: 0; position: relative; }
.wb.folded { grid-template-columns: minmax(0, 1fr) 46px; }
.wb-strip { grid-column: 1 / -1; }
.strip-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 10px 20px; padding: 12px 16px 12px; align-items: start; }
.strip-col { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.strip-label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
.strip-label .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
.strip-out { padding: 0 16px 12px; }
.combo-wrap { position: relative; min-width: 0; }
.combo {
  width: 100%; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; text-align: left; min-width: 0;
}
.combo:hover { border-color: var(--accent-border); }
.combo .name { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.combo .rm { font-family: var(--font-mono); font-size: 12px; color: var(--text-3); }
.combo .chev-d { margin-left: auto; color: var(--text-3); }
.combo .ph { color: var(--text-3); font-size: 13px; }
.combo-pop {
  position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; width: auto; max-height: 380px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-pop); padding: 6px 6px 0;
  display: flex; flex-direction: column; container-type: inline-size;
}
.combo-pop .input { width: 100%; margin-bottom: 6px; }
.opt {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 12.5px;
}
.opt:hover, .opt[aria-selected="true"] { background: var(--accent-soft); }
.opt .n { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.opt .n b { font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; }
.opt .rm { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); }
.opt .sz { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.pf { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--text-2); }
.pf-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.pf-item.ok .icon { color: var(--ok); }
.pf-item.warn .icon { color: var(--warn); }
.pf-item.err { color: var(--err); }
.pf-item.err .icon { color: var(--err); }
.pf-item.info .icon { color: var(--accent-text); }
.pf-item .icon { width: 14px; height: 14px; }
.prog-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-line {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2);
  padding: 6px 10px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
}
.card-line .icon { color: var(--text-3); }
.card-line b { color: var(--text); font-weight: 500; font-family: var(--font-mono); font-size: 12px; }
.progress-box { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; border: 1px solid var(--accent-border); border-radius: 8px; background: var(--accent-soft); }
.progress-box .meter-line { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); gap: 10px; }
.strip-flash { animation: stripflash 1.2s ease 1; }
@keyframes stripflash { 30% { box-shadow: 0 0 0 3px var(--accent-border); } }

.wb-main { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.console-card { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.console-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.console-tab {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border: 1px solid var(--border);
  border-radius: 7px; background: var(--surface); cursor: pointer; font-size: 12.5px; color: var(--text-2); white-space: nowrap;
}
.console-tab[aria-selected="true"] { border-color: var(--accent-border); background: var(--accent-soft); color: var(--accent-text); }
.console-name { font-size: 13px; font-weight: 600; white-space: nowrap; }
.console-note { padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.term {
  flex: 1; min-height: 120px; overflow-y: auto; background: var(--term-bg); color: var(--term-fg); font-family: var(--font-mono);
  font-size: 12.5px; line-height: 1.55; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere;
}
.term .sys { color: var(--text-3); }
.term .ban { color: var(--ok); font-weight: 500; }
.term .echo { color: var(--accent-text); }
.term .errl { color: var(--err); }
.term .cursor { display: inline-block; width: 7px; height: 14px; background: var(--term-cursor); vertical-align: -2px; animation: blinkc 1s steps(1) infinite; }
@keyframes blinkc { 50% { opacity: 0; } }
.console-send { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }
.console-send .input { flex: 1; }
.attach-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; }
.attach-row .copy-row { flex: 1; min-width: 220px; }
.reset-group { display: inline-flex; align-items: center; gap: 4px; padding-left: 8px; border-left: 1px solid var(--border); }

.wb-rail { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 2px; }
.rail-fold-head { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); padding: 0 2px; }
.wb-rail .card-head { padding: 12px 16px 0; }
.wb-rail .card-body { padding: 10px 16px 16px; }
.wb-rail .kv { grid-template-columns: 78px minmax(0, 1fr); gap: 7px 12px; }
.fold-strip { align-self: flex-start; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-height: 0; }
.fold-btn {
  position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--text-2); cursor: pointer;
}
.fold-btn:hover { background: var(--hover); color: var(--text); }
.fold-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-border); }
.fold-btn .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; box-shadow: 0 0 0 2px var(--surface); }
.fold-lbl { font-size: 10px; color: var(--text-3); margin-top: -4px; margin-bottom: 4px; letter-spacing: .02em; }
.fold-sep { width: 24px; height: 1px; background: var(--border); margin: 2px 0; }
.flyout {
  position: absolute; z-index: 25; right: 56px; top: 0; width: min(400px, 62vw); max-height: 100%; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-pop);
}
.flyout .card { border: 0; box-shadow: none; }
.flyout-wrap { grid-column: 2; grid-row: 2; position: relative; min-height: 0; display: flex; }

/* --- the front panel (LCD) ------------------------------------------------------------------ */
.lcd-frame { container-type: inline-size; width: 100%; max-width: 100%; }
.lcd {
  width: 100%; aspect-ratio: 4 / 3; background: var(--lcd-bg); color: var(--lcd-text); font-family: var(--font-mono);
  font-size: 11px; font-size: calc(100cqw / 25.2); line-height: calc(100cqw * 0.75 / 15); display: flex; flex-direction: column; overflow: hidden;
  border-radius: 3px; outline: 1px solid var(--border-strong); outline-offset: 2px; padding: 0; user-select: text;
}
.lcd-row { height: calc(100% / 15); white-space: pre; overflow: hidden; padding: 0 1.2%; display: block; }
.lcd-row.title { background: var(--lcd-title); }
.lcd-row.banner { background: var(--lcd-banner); color: var(--lcd-banner-fg); font-weight: 500; }
.lcd-row.rule { border-bottom: 1px solid var(--lcd-rule); height: calc(100% / 30); }
.lcd .l { color: var(--lcd-label); }
.lcd .ok { color: var(--lcd-ok); }
.lcd .warn { color: var(--lcd-warn); }
.lcd .held { color: var(--lcd-held); }
.lcd .acc { color: var(--lcd-accent); }
.lcd .dim { color: var(--lcd-rule); }
.lcd.blink { animation: backlight 0.5s steps(1) infinite; }
@keyframes backlight { 0% { filter: none; } 50% { filter: brightness(0.18); } }
.lcd.grey { filter: grayscale(1) opacity(0.45); }
.panel-text { list-style: none; margin: 0; padding: 0; font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; }
.panel-text li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
.panel-text li .k { color: var(--text-3); font-family: var(--font-mono); font-size: 11.5px; }
.panel-text li .v { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.watchers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--text-2); }
.watchers li { display: flex; align-items: center; gap: 6px; }
.watchers .icon { width: 13px; height: 13px; color: var(--text-3); }
.identify-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.identify-until { display: inline-flex; align-items: center; gap: 5px; color: var(--accent-text); font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* --- preview (not open) --------------------------------------------------------------------- */
.preview { max-width: 780px; }
.preview .open-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* --- drawer, modals, toast ------------------------------------------------------------------ */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer {
  position: fixed; z-index: 41; top: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); bottom: 0; left: var(--rail-w);
  width: min(520px, calc(100vw - var(--rail-w))); background: var(--surface); border-right: 1px solid var(--border);
  box-shadow: var(--shadow-pop); display: flex; flex-direction: column; animation: slidein .16s ease-out;
}
@keyframes slidein { from { transform: translateX(-24px); opacity: 0; } }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.drawer-body { flex: 1; overflow-y: auto; padding: 4px 0 12px; }
.drawer-foot { border-top: 1px solid var(--border); padding: 10px 16px; font-size: 12px; color: var(--text-3); }
.log-day { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); padding: 10px 16px 4px; }
.log-row { display: grid; grid-template-columns: 44px 16px minmax(0, 1fr); gap: 8px; padding: 7px 16px; border-bottom: 1px solid var(--border); font-size: 12.5px; align-items: start; }
.log-row:last-child { border-bottom: 0; }
.log-row .t { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); padding-top: 1px; }
.log-row .icon { width: 14px; height: 14px; margin-top: 2px; }
.log-row .lv-ok { color: var(--ok); } .log-row .lv-err { color: var(--err); } .log-row .lv-warn { color: var(--warn); } .log-row .lv-info { color: var(--text-3); }
.log-row .msg { overflow-wrap: anywhere; color: var(--text); }
.log-row .meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; color: var(--text-3); font-size: 11.5px; flex-wrap: wrap; }
.log-row.hl { background: var(--err-soft); }
.link { background: none; border: 0; padding: 0; color: var(--accent-text); cursor: pointer; font-size: inherit; text-decoration: underline; text-underline-offset: 2px; }
.modal-back { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 45; padding: 24px 16px; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-pop);
  width: min(560px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; min-height: 0;
}
.modal.wide { width: min(980px, 100%); }
.modal.mid { width: min(700px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; }
.modal-head .icon { color: var(--text-3); }
.modal-pad { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; }
.modal-pad p { line-height: 1.5; }
.modal-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.modal-foot .grow { flex: 1; }
.choice { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--surface-2); }

.srow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 260px); gap: 6px 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }

.toast {

  padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow-pop); display: flex; gap: 8px; align-items: center;
}
.wc h3 { font-size: 13.5px; font-weight: 600; margin: 4px 0 8px; }
.wc-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
.wc ol, .wc ul { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 4px; }

.wc .table td:first-child, .wc .table th:first-child { padding-left: 0; }
.wc .table td:last-child, .wc .table th:last-child { padding-right: 0; }
.clicks { font-variant-numeric: tabular-nums; white-space: nowrap; }
.clicks .was { color: var(--text-3); text-decoration: line-through; }
.clicks .now { color: var(--ok); font-weight: 600; }

/* --- Build, Board, Checks -------------------------------------------------------------------- */
.flow-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); flex: none; }
.step-card[data-state="done"] .flow-n { background: var(--ok-soft); border-color: var(--ok-border); color: var(--ok); }
.step-card[data-state="next"] { border-color: var(--accent-border); }
.step-card[data-state="next"] .flow-n { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-text); }
.step-card[data-state="blocked"] .card-title { color: var(--text-2); }
.build-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.trouble { border-top: 1px solid var(--border); }
.trouble:first-child { border-top: 0; }
.trouble > summary { display: flex; align-items: center; gap: 8px; padding: 7px 16px; cursor: pointer; font-size: 12.5px; font-family: var(--font-mono); list-style: none; }
.trouble > summary::-webkit-details-marker { display: none; }
.trouble > summary .icon { color: var(--text-3); transition: transform .12s; }
.trouble[open] > summary .icon { transform: rotate(90deg); }
.trouble p { padding: 0 16px 10px 40px; font-size: 12.5px; color: var(--text-2); }
.ladder { list-style: none; margin: 0; padding: 0; }
.ladder li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 16px; border-top: 1px solid var(--border); }
.ladder li:first-child { border-top: 0; }
.ladder .t { font-weight: 600; font-size: 13px; }
.ladder .d { font-size: 12.5px; color: var(--text-2); }
.ladder .acts { display: flex; align-items: center; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.hrows { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); }
.hrow { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
.hrow:first-child { border-top: 0; }
.hrow.picked { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.hrow-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hver { font-size: 14px; font-weight: 600; font-family: var(--font-mono); }
.plan-steps { margin: 0; padding-left: 20px; font-size: 12.5px; color: var(--text-2); }
.plan-steps li { padding: 2px 0; }
.plan-steps li.done { color: var(--text-3); }
.plan-steps li.active { color: var(--accent-text); font-weight: 500; }
.plan-steps .mono { color: var(--text); margin-right: 6px; }
.caps { display: flex; flex-wrap: wrap; gap: 5px; }
.cap { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); font-size: 12px; color: var(--text-2); }
.cap .icon { width: 13px; height: 13px; color: var(--ok); }
.caps-missing { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.caps-missing li { padding: 6px 0; border-top: 1px solid var(--border); }
.caps-missing li:first-child { border-top: 0; }
.caps-missing b { font-weight: 500; }
.checks-form { display: flex; flex-direction: column; gap: 10px; }
.run-box { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--accent-border); background: var(--accent-soft); border-radius: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  .lcd.blink { animation: none; outline: 3px solid var(--accent); }
}

/* --- responsive: 1024 x 768 and down ---------------------------------------------------------- */

}

}

@media (max-width: 760px) {
  body { overflow: auto; }
  .app { position: static; display: block; padding-top: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); }
  .rail { display: none; }
  .mobile-top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--rail); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .mobile-top .select { flex: 1; min-width: 0; }
  .workspace { min-height: 0; }
  .board-header { padding: 12px 16px 0; }
  .header-row1 { flex-wrap: wrap; }
  .section-body, .section-body.fill { overflow: visible; padding: 14px 16px 22px; display: block; }
  .wb, .wb.folded { display: flex; flex-direction: column; }
  .wb-main { min-height: 420px; }
  .wb-rail { overflow: visible; }

  .drawer { left: 0; width: 100%; }
  .settings-body { grid-template-columns: minmax(0, 1fr); }
  .modal-nav { display: flex; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); }

}

.field-label { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
.log-row .lv-ok, .log-row .lv-err, .log-row .lv-warn, .log-row .lv-info { display: inline-flex; }
/* === B2-OVERVIEW begin === */
/* Overview: one screen. Needs attention (severity stripes) → identity + readings → three columns. */
.ov { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ov-att { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.ov-att-head { display: flex; align-items: center; gap: 7px; padding: 6px 14px; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-2); }
.ov-att-head .icon { width: 14px; height: 14px; color: var(--warn); }
.ov-att.err .ov-att-head .icon { color: var(--err); }
.ov-att-n { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center; font-size: 11px; letter-spacing: 0; background: var(--warn); color: var(--on-err); }
.ov-att.err .ov-att-n { background: var(--err); }
.ov-att ul { list-style: none; margin: 0; padding: 0; }
.ov-att-row {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 12px 6px 16px;
  border-top: 1px solid var(--border); font-size: 13px; line-height: 1.4; background: var(--warn-soft); box-shadow: inset 4px 0 0 var(--warn);
}
.ov-att-row.err { background: var(--err-soft); box-shadow: inset 4px 0 0 var(--err); }
.ov-att-row > .icon { color: var(--warn); }
.ov-att-row.err > .icon { color: var(--err); }
.ov-att-text { color: var(--text-2); overflow-wrap: anywhere; }
.ov-att-text strong { color: var(--text); font-weight: 600; }

.ov-sum { overflow: hidden; }
.ov-id { display: flex; align-items: center; flex-wrap: nowrap; gap: 6px 16px; padding: 7px 8px 7px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); font-size: 12.5px; min-width: 0; }
.ov-id-i { display: inline-flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.ov-id-k { color: var(--text-3); font-size: 11.5px; }
.ov-id-i.ov-shrink { flex: 0 1 auto; }
.ov-ell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-id-i .mono { color: var(--text); font-size: 12px; }
.ov-id-i .ov-id-bad { color: var(--err); display: inline-flex; align-items: center; gap: 4px; }
.ov-id-note { font-size: 11.5px; color: var(--warn); }
.ov-chip-sm { height: 20px; font-size: 11.5px; padding: 0 8px; }
.ov-chip-sm .icon { width: 12px; height: 12px; }
.ov-kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.ov-kpi { position: relative; padding: 9px 14px 10px; border-left: 1px solid var(--border); min-width: 0; }
.ov-kpi:first-child { border-left: 0; }
.ov-kpi.warn { background: var(--warn-soft); box-shadow: inset 0 3px 0 var(--warn); }
.ov-kpi.err { background: var(--err-soft); box-shadow: inset 0 3px 0 var(--err); }
.ov-kpi-l { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.ov-kpi-v { display: flex; align-items: center; gap: 8px; min-height: 32px; margin-top: 1px; font-size: 21px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.ov-kpi-v small { font-size: 12px; font-weight: 500; color: var(--text-2); margin-left: 4px; }
.ov-kpi.stale .ov-kpi-v > span:first-child { color: var(--text-2); }
.ov-unav { font-size: 14px; font-weight: 500; color: var(--unk); }
.ov-kpi-s { font-size: 11.5px; color: var(--text-3); line-height: 1.4; }
.ov-kpi-s > span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-kpi.warn .ov-kpi-s > span:first-child { color: var(--warn); }
.dot.ov-dot-unk { background: transparent; border: 1.5px dashed var(--unk-border); }
.ov-spark { width: 80px; height: 28px; margin-left: auto; flex: none; overflow: visible; cursor: crosshair; }
.ov-spark .ln { fill: none; stroke: var(--text-3); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.ov-spark .xh { stroke: var(--border-strong); stroke-width: 1; }
.ov-spark .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }

.ov-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 272px; gap: 10px; align-items: stretch; }
.ov-grid > .ov-panel { grid-column: 3; grid-row: 1 / span 2; }
.ov-card { display: flex; flex-direction: column; min-width: 0; }
.ov-card .card-head { padding: 8px 8px 0 14px; min-height: 34px; flex-wrap: nowrap; }
.ov-card .card-title { font-size: 13.5px; white-space: nowrap; }
.ov-card .card-body { flex: 1; display: flex; flex-direction: column; gap: 9px; padding: 6px 14px 12px; min-width: 0; }
.ov-go {
  display: inline-flex; align-items: center; gap: 1px; height: 24px; padding: 0 4px 0 8px; border: 0; border-radius: 6px;
  background: transparent; color: var(--accent-text); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; flex: none;
}
.ov-go:hover { background: var(--accent-soft); }
.ov-go .icon { width: 14px; height: 14px; }
.ov-kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 7px 10px; margin: 0; font-size: 12.5px; align-items: center; }
.ov-kv dt { color: var(--text-3); font-size: 12px; }
.ov-kv dd { margin: 0; min-width: 0; display: flex; align-items: center; gap: 4px 7px; flex-wrap: wrap; overflow-wrap: anywhere; }
.ov-kv .sub { color: var(--text-3); font-size: 12px; }
.ov-design { display: flex; align-items: baseline; gap: 4px 9px; flex-wrap: wrap; }
.ov-name { font-size: 19px; font-weight: 600; line-height: 1.25; font-family: var(--font-mono); letter-spacing: -0.01em; }
.ov-design .tags { align-self: center; }
.ov-meter { height: 6px; border-radius: 3px; background: var(--accent-soft); border: 1px solid var(--accent-border); overflow: hidden; }
.ov-meter > div { height: 100%; background: var(--accent); }
.ov-meter.warn { background: var(--warn-soft); border-color: var(--warn-border); }
.ov-meter.warn > div { background: var(--warn); }
.ov-lease-top { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.ov-watch { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ov-watch li { display: flex; align-items: center; gap: 6px; color: var(--text-2); min-width: 0; }
.ov-watch li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-watch b { font-weight: 500; color: var(--text); }
.ov-watch .icon { width: 13px; height: 13px; color: var(--text-3); }
.ov-cons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ov-cons li { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 4px 9px; align-items: center; font-size: 12.5px; min-width: 0; }
.ov-cons-name { display: flex; align-items: baseline; gap: 6px 8px; min-width: 0; flex-wrap: wrap; }
.ov-cons-name b { font-weight: 500; white-space: nowrap; }
.ov-cons-name .sub { color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-last {
  grid-column: 2; font-family: var(--font-mono); font-size: 11.5px; color: var(--term-fg); background: var(--term-bg);
  border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ov-last.sys { color: var(--text-3); }
.ov-cons-name .chip { align-self: center; }
.ov-cons-name .chip:first-of-type { margin-left: auto; }
.ov-log { list-style: none; margin: -2px -8px 0; padding: 0; display: flex; flex-direction: column; }
.ov-log-row {
  display: grid; grid-template-columns: 38px 16px minmax(0, 1fr); gap: 6px; align-items: center; width: 100%; padding: 4px 8px;
  border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; font-size: 12.5px; color: var(--text);
}
.ov-log-row:hover { background: var(--hover); }
.ov-log-row .t { font-family: var(--font-mono); font-size: 11.5px; color: var(--text-3); }
.ov-log-row .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-log-row .icon { width: 14px; height: 14px; }
.ov-log .lv-ok { color: var(--ok); display: inline-flex; }
.ov-log .lv-err { color: var(--err); display: inline-flex; }
.ov-log .lv-warn { color: var(--warn); display: inline-flex; }
.ov-log .lv-info { color: var(--text-3); display: inline-flex; }
.ov-panel-body { display: flex; flex-direction: column; gap: 10px; }
.ov-panel .panel-text { font-size: 12px; gap: 3px; }
.ov-panel .panel-text li { grid-template-columns: 52px minmax(0, 1fr); }
.ov-panel-meta { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
@media (max-width: 1300px) {
  .ov-id { flex-wrap: wrap; }
  .ov-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ov-kpi:nth-child(3n+1) { border-left: 0; }
  .ov-kpi:nth-child(n+4) { border-top: 1px solid var(--border); }
}
@media (max-width: 1180px) {
  .ov-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ov-grid > .ov-panel { grid-column: 1 / -1; grid-row: auto; order: 5; }
  .ov-panel-body { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); align-items: start; gap: 16px; }
}
@media (max-width: 760px) {
  .ov-grid { grid-template-columns: minmax(0, 1fr); }
  .ov-panel-body { grid-template-columns: minmax(0, 1fr); }
  .ov-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}

/* the picker: popup as wide as its trigger; Import beside it and at its foot */
.combo-row { display: flex; gap: 8px; align-items: stretch; min-width: 0; }

.combo-foot button {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: 6px;
  background: transparent; color: var(--accent-text); font-weight: 500; font-size: 12.5px; cursor: pointer; text-align: left;
}
.combo-foot button:hover { background: var(--accent-soft); }
.combo-foot .muted { margin-left: auto; font-weight: 400; font-size: 11.5px; }
.tag.imp { color: var(--held); background: var(--held-soft); border-color: var(--held-border); }
@container (max-width: 400px) {
  .opt { grid-template-columns: minmax(0, 1fr) auto; row-gap: 2px; }
  .opt .sz { display: none; }
  .combo-foot .muted { display: none; }
}

/* the console switcher */
.cs-bar { gap: 8px; padding: 7px 10px; }
.cs-seg { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); min-width: 0; flex-wrap: wrap; }
.cs-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; color: var(--text-2); cursor: pointer; font-size: 12.5px; font-weight: 500; white-space: nowrap;
}
.cs-btn:hover { color: var(--text); background: var(--hover); }
.cs-btn[aria-selected="true"] { background: var(--surface); color: var(--text); border-color: var(--border-strong); box-shadow: var(--shadow); }
.cs-btn .icon { width: 13px; height: 13px; color: var(--text-3); }
.cs-new {
  min-width: 18px; height: 16px; padding: 0 5px; border-radius: 8px; font-size: 10.5px; font-weight: 600; line-height: 1;
  display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent-border);
}
.cs-short { display: none; }
.dot.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
.dot.idle { background: var(--text-3); }
.cs-info { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; min-height: 42px; background: var(--surface); }
.cs-now { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.cs-now .icon { color: var(--text-3); }
.cs-info .chip { height: 20px; font-size: 11.5px; }
.cs-info { flex-wrap: nowrap; }
.cs-info .csub { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-info .chip { flex: none; }
.cs-tools { display: inline-flex; gap: 2px; margin-left: auto; flex: none; }
.cs-tools .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.cs-tools .btn:disabled { opacity: .45; cursor: not-allowed; }
.header-title .chip { font-size: 12px; font-weight: 500; }
.term-off {
  margin: auto; max-width: 440px; text-align: center; color: var(--text-2); font-family: var(--font-sans); font-size: 13px;
  white-space: normal; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 8px;
}
.term-off .icon { width: 22px; height: 22px; color: var(--text-3); }
.term-off b { color: var(--text); font-weight: 600; }
.term { border-radius: 0; }
.console-send .input:disabled { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; }
@media (max-width: 1180px) {
  .cs-long { display: none; }
  .cs-short { display: inline; }
  .cs-info .csub { display: none; }
}

/* Import a design */
.imp-ways { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.imp-way {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 9px 11px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--surface-2); cursor: pointer; text-align: left; color: var(--text); min-width: 0;
}
.imp-way b { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.imp-way b .icon { color: var(--text-3); }
.imp-way span { font-size: 12px; color: var(--text-2); line-height: 1.35; }
.imp-way[aria-pressed="true"] { border-color: var(--accent-border); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-border); }
.imp-way[aria-pressed="true"] b .icon { color: var(--accent-text); }
.imp-drop {
  border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; align-items: center;
  gap: 8px; text-align: center; background: var(--surface-2); color: var(--text-2); font-size: 12.5px;
}
.imp-drop.over { border-color: var(--accent); background: var(--accent-soft); }
.imp-drop > .icon { width: 22px; height: 22px; color: var(--text-3); }
.imp-drop code { font-size: 11.5px; }
.imp-file { position: relative; overflow: hidden; }
.imp-file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }
.imp-samples { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
.imp-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 8px; }
.imp-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--border); }
.imp-list li:first-child { border-top: 0; }
.imp-list li.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.imp-list .nm { font-family: var(--font-mono); font-weight: 500; font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.imp-list .sub { font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.imp-picked { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
.imp-picked b { font-family: var(--font-mono); font-weight: 500; }
.imp-checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; }
.imp-checks li { display: grid; grid-template-columns: 18px 170px minmax(0, 1fr); gap: 10px; align-items: start; padding: 7px 12px; border-top: 1px solid var(--border); font-size: 12.5px; }
.imp-checks li:first-child { border-top: 0; }
.imp-checks .icon { width: 15px; height: 15px; margin-top: 1px; color: var(--text-3); }
.imp-checks .t { font-weight: 500; }
.imp-checks .d { color: var(--text-2); overflow-wrap: anywhere; }
.imp-checks li.ok .icon { color: var(--ok); }
.imp-checks li.err { background: var(--err-soft); }
.imp-checks li.err .icon, .imp-checks li.err .t { color: var(--err); }
.imp-checks li.run .icon { color: var(--accent); animation: spin 1s linear infinite; }
.imp-checks li.skip { color: var(--text-3); }
.imp-checks li.skip .d { color: var(--text-3); }
.exit-code { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 4px; border: 1px solid var(--err-border); color: var(--err); background: var(--surface); white-space: nowrap; }
@media (max-width: 760px) {
  .imp-ways { grid-template-columns: minmax(0, 1fr); }
  .imp-checks li { grid-template-columns: 18px minmax(0, 1fr); }
  .imp-checks li .d { grid-column: 2; }
}
@media (max-width: 1180px) {
  .combo-row .imp-lbl { display: none; }
  .combo-row .imp-btn { width: 34px; padding: 0; }
}
/* What changed: the dark-mode before/after */
.wc-dark td { font-size: 12px; vertical-align: top; }
.wc-dark .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--border-strong); vertical-align: -1px; margin-right: 3px; }
/* === B2-WORKBENCH end === */
/* === B2-BOARD begin === */
/* Board tab: two columns; one ordered column below 1180 px (Connections first). */
.bt-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.bt-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.bt-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.bt-foot .grow { flex: 1; }
@media (max-width: 1180px) {
  .bt-grid { display: flex; flex-direction: column; align-items: stretch; }
  .bt-col { display: contents; }
  .bt-o1 { order: 1; } .bt-o2 { order: 2; } .bt-o3 { order: 3; } .bt-o4 { order: 4; } .bt-o5 { order: 5; }
  .bt-o6 { order: 6; } .bt-o7 { order: 7; } .bt-o8 { order: 8; } .bt-o9 { order: 9; }
}

/* Connections: the diagram, then one row per link */
.cx-fig { margin: 2px 0 10px; }
.cx-svg { display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto; overflow: visible; }
.cx-box { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1; }
.cx-board { fill: none; stroke: var(--text-3); stroke-width: 1.25; }
.cx-dim { opacity: .5; stroke-dasharray: 3 3; }
.cx-t { fill: var(--text); font: 600 12px var(--font-sans); text-anchor: middle; }
.cx-s { fill: var(--text-3); font: 400 10.5px var(--font-sans); text-anchor: middle; }
.cx-l { fill: var(--text-2); font: 500 11px var(--font-sans); text-anchor: middle; }
.cx-end { text-anchor: end; }
.cx-lu { fill: var(--accent-text); }
.cx-ln { fill: var(--warn); }
.cx-eth { stroke: var(--text-2); stroke-width: 2; }
.cx-usb { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linejoin: round; }
.cx-none { stroke: var(--warn); stroke-width: 2; stroke-dasharray: 4 4; }
.cx-x { stroke: var(--warn); stroke-width: 2.2; stroke-linecap: round; fill: none; }
.cx-cap { font-size: 12px; color: var(--text-3); text-align: center; margin-top: 6px; }
.cx-rows { list-style: none; margin: 0; padding: 0; }
.cx-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 12px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 13px; }
.cx-k { display: flex; align-items: center; gap: 7px; font-weight: 500; align-self: start; min-height: 22px; }
.cx-k .icon { color: var(--text-3); }
.cx-v { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.cx-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.cx-gives { display: flex; flex-wrap: wrap; gap: 4px; }
.cx-give { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; line-height: 18px; padding: 0 7px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.cx-give .icon { width: 12px; height: 12px; color: var(--ok); }
.cx-give.no { color: var(--text-3); background: transparent; border-style: dashed; text-decoration: line-through; }
.cx-give.no .icon { color: var(--warn); }

/* Recover: the ladder, a severity scale, what each step keeps */
.rc { container-type: inline-size; }
.rc-head { display: flex; flex-direction: column; gap: 8px; padding: 6px 16px 12px; }
.rc-scale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-3); }
.rc-grad { flex: 1; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--ok), var(--accent) 30%, var(--warn) 65%, var(--err)); }
.rc-list { list-style: none; margin: 0; padding: 0; }
.rc-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 7px 12px; align-items: start; padding: 12px 16px; border-top: 1px solid var(--border); }
.rc-row.armed { box-shadow: inset 3px 0 0 var(--warn); background: var(--surface-2); }
.rc-row.off .rc-t { color: var(--text-2); }
.rc-row.off .rc-rung { opacity: .55; }
.rc-rung { grid-row: 1; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; border: 1px solid; }
.rc-row[data-sev="1"] { --sev: var(--ok); } .rc-row[data-sev="2"] { --sev: var(--accent); } .rc-row[data-sev="3"] { --sev: var(--warn); }
.rc-row[data-sev="4"] { --sev: var(--warn); } .rc-row[data-sev="5"] { --sev: var(--err); }
.rc-row[data-sev="1"] .rc-rung { background: var(--ok-soft); border-color: var(--ok-border); color: var(--ok); }
.rc-row[data-sev="2"] .rc-rung { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-text); }
.rc-row[data-sev="3"] .rc-rung { background: var(--warn-soft); border-color: var(--warn-border); color: var(--warn); }
.rc-row[data-sev="4"] .rc-rung { background: var(--warn); border-color: var(--warn); color: var(--on-err); }
.rc-row[data-sev="5"] .rc-rung { background: var(--err); border-color: var(--err); color: var(--on-err); }
.rc-main { grid-column: 2; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 26px; }
.rc-t { font-weight: 600; font-size: 13.5px; }
.rc-sev { display: inline-flex; gap: 2px; color: var(--sev); }
.rc-sev i { width: 9px; height: 4px; border-radius: 1px; background: var(--border-strong); }
.rc-sev i.on { background: currentColor; }
.rc-time { height: 20px; font-size: 11.5px; padding: 0 7px; }
.rc-time .icon { width: 12px; height: 12px; color: var(--text-3); }
.rc-d { font-size: 12.5px; color: var(--text-2); line-height: 1.45; }
.rc-acts { grid-column: 3; grid-row: 1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.rc-keeps { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.rc-extra { grid-column: 2 / -1; min-width: 0; }
.kp { display: flex; align-items: center; gap: 4px; min-height: 22px; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface-2); font-size: 11.5px; color: var(--text-2); line-height: 1.2; min-width: 0; cursor: default; }
.kp > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kp .icon { width: 12px; height: 12px; flex: none; }
.kp.kept .icon { color: var(--ok); }
.kp.lost { background: var(--err-soft); border-color: var(--err-border); color: var(--err); }
.kp.back, .kp.held, .kp.reload { background: var(--warn-soft); border-color: var(--warn-border); color: var(--warn); }
.rc-legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 16px 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-3); }
.rc-legend .kp { display: inline-flex; }
@container (max-width: 540px) {
  .rc-row { grid-template-columns: 26px minmax(0, 1fr); }
  .rc-acts { grid-column: 2; grid-row: auto; justify-content: flex-start; }
  .rc-keeps { grid-column: 2; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rc-extra { grid-column: 2; }
}

/* Harness & OS versions: slots, netboot, the plan inline */
.os-card-line { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-3); margin-bottom: 8px; flex-wrap: wrap; }
.os-card-line .icon { width: 14px; height: 14px; }
.os-slots { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.os-slot { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); min-width: 0; }
.os-slot.run { border-color: var(--ok-border); box-shadow: inset 3px 0 0 var(--ok); }
.os-slot.busy { border-color: var(--accent-border); box-shadow: inset 3px 0 0 var(--accent); }
.os-slot.torn { border-style: dashed; border-color: var(--warn-border); background: var(--warn-soft); }
.os-slot.bad { border-color: var(--err-border); box-shadow: inset 3px 0 0 var(--err); }
.os-slot-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.os-letter { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.os-rel { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }
.os-store { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--text-2); }
.os-store .icon { color: var(--text-3); }
.os-store b { font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--text); }
.os-net { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.os-net-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.os-net-h .icon { color: var(--text-3); }
.os-plan { margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--border-strong); display: flex; flex-direction: column; gap: 10px; }
.os-plan-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.os-plan-h b { color: var(--text); font-weight: 600; }
.os-plan-h .grow { flex: 1; }
.os-plan-h .chip { height: 20px; font-size: 11.5px; }
.os-steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.os-step { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--text-3); min-width: 0; }
.os-step .bar { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
.os-step .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
.os-step.done .bar > i { width: 100%; background: var(--ok); }
.os-step.sd .bar { background: var(--warn-border); }
.os-step .n { font-weight: 500; color: var(--text-2); line-height: 1.25; overflow-wrap: anywhere; }
.os-step.active .n { color: var(--text); }
.os-step.done .n { color: var(--text-3); }
.os-step .t { font-variant-numeric: tabular-nums; }
.os-step.sd .t { color: var(--warn); }
.os-live { display: flex; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.os-live b { color: var(--text); font-weight: 600; }
.os-ask { margin: 0; padding-left: 20px; font-size: 12.5px; color: var(--text-2); display: flex; flex-direction: column; gap: 6px; }
.os-ask b { color: var(--text); font-weight: 500; }
.os-demo { margin-top: 12px; padding: 8px 10px; border: 1px dashed var(--border-strong); border-radius: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--text-3); }
.os-proto { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 5px; color: var(--text-2); }
@media (max-width: 560px) {
  .os-slots { grid-template-columns: minmax(0, 1fr); }
  .os-steps { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cx-row { grid-template-columns: minmax(0, 1fr); }
}
/* === B2-BOARD end === */
/* === B2-BUILD begin === */
/* The Build tab: a stepper across the top, one focused step panel under it. Tokens only. */
.bd { display: flex; flex-direction: column; gap: 14px; max-width: 1060px; }
.bd-head { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.bd-top { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
.bd-title { font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.bd-title .icon { color: var(--text-3); }
.bd-demo { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 3px 3px 6px; border: 1px dashed var(--border-strong); border-radius: 8px; max-width: 100%; min-width: 0; }
.bd-demo .select { height: 26px; font-size: 12px; padding: 0 6px; min-width: 0; max-width: 240px; }
.bd-stepper { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.bd-node { position: relative; min-width: 0; }
.bd-node::before { content: ""; position: absolute; top: 15px; left: calc(-50% + 20px); right: calc(50% + 20px); height: 2px; border-radius: 1px; background: var(--border-strong); }
.bd-node:first-child::before { display: none; }
.bd-node.lit::before { background: var(--ok); }
.bd-node > button { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 4px 6px; background: transparent; border: 0; border-radius: 8px; cursor: pointer; color: inherit; min-width: 0; }
.bd-dot { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border-strong); background: var(--surface); color: var(--text-3); font-size: 13px; font-weight: 600; transition: box-shadow .12s, border-color .12s; }
.bd-dot .icon { width: 16px; height: 16px; }
.bd-node > button:hover .bd-dot { border-color: var(--accent); }
.bd-node.done .bd-dot { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.bd-node.warn .bd-dot { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.bd-node.current .bd-dot, .bd-node.running .bd-dot { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); box-shadow: 0 0 0 4px var(--accent-soft); }
.bd-node.failed .bd-dot { background: var(--err-soft); border-color: var(--err); color: var(--err); box-shadow: 0 0 0 4px var(--err-soft); }
.bd-node.blocked .bd-dot { border-style: dashed; }
.bd-lbl { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 3px; }
.bd-node.blocked .bd-lbl { color: var(--text-3); font-weight: 500; }
.bd-node.failed .bd-lbl { color: var(--err); }
.bd-sub { font-size: 11.5px; color: var(--text-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-node.running .bd-sub, .bd-node.current .bd-sub { color: var(--accent-text); }
.bd-node.failed .bd-sub { color: var(--err); }
.bd-node.viewing .bd-lbl { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--accent); }

let _force = null;
function up(fn) { if (fn) fn(S); if (_force) _force((n) => n + 1); }
function log(board, lvl, msg, go = null) {
  const top = S.log[0];
  if (top && top.board === board && top.msg === msg && Date.now() - (top.ms || 0) < 8000) return;
  S.log.unshift({ id: LID++, t: hhmm(nowS()), board, lvl, msg, go, ms: Date.now() });
}
function toast(text, icon = "circle-check") {

}
function pushLine(b, cid, text, cls = "") {
  const arr = b.lines[cid] || (b.lines[cid] = []);
  if (arr.length && arr[arr.length - 1][0] === "nanosoc> " && cls !== "echo") arr.pop();
  arr.push([text, cls]);
  if (arr.length > 400) arr.splice(0, arr.length - 400);
}
const dutConsole = (b) => (b.consoles.find((c) => c.dut) || b.consoles[0]).id;
const hasCpu = (b) => !!ovl(b.design).cpu;
