/* ---------- leases ---------- */
function leaseInfo(b) {
  if (!b.hub || !b.lease) return null;
  const L = b.lease;
  switch (L.kind) {
    case "yours": return { text: `Yours · ${dur(L.min)}`, level: "accent", icon: "user", title: "You hold the hub lease here" };
    case "free": return { text: "Free", level: "plain", icon: "lock-open", title: "Nobody holds the hub lease" };
    case "held": return { text: `Held by ${L.holder} · ${dur(L.min)}`, level: "held", icon: "lock", title: `${L.who} holds the hub lease` };
    case "other": return { text: `Held by you in another session (${L.job})`, level: "held", icon: "lock", title: `david@mapstone-dev · ${L.note} · until ${L.until}. Stop ${L.job} on mapstone-dev to take it here.` };
  }
  return null;
}
const canDrive = (b) => !b.hub || (b.lease && b.lease.kind === "yours");
function driveReason(b) {
  const L = b.lease;
  if (!b.hub || !L) return null;
  if (L.kind === "held") return `Held by ${L.holder} · ${dur(L.min)}: request the board to drive it`;
  if (L.kind === "other") return `Your ${L.job} session holds the lease until ${L.until}: watch only here`;
  if (L.kind === "free") return "Nobody holds the lease: Acquire it in the header first";
  return null;
}
function LeaseChip({ b, short }) {
  const li = leaseInfo(b);
  if (!li) return null;
  return html`<span class=${"chip " + li.level} title=${li.title}>${I(li.icon)}<span>${li.text}</span></span>`;
}
function ReqChip({ b }) {
  if (!b.lease || !b.lease.req) return null;
  return html`<span class="chip accent" title="Your request is in the hub's queue">${I("send")}<span>Requested · #${b.lease.req}</span></span>`;
}
function acquire(b) {
  b.lease = { kind: "yours", min: 60 };
  log(b.id, "info", `Lease acquired ${b.id} (60 min)`);
}
function release(b) {
  b.lease = { kind: "free" };
  b.debug = { state: "down" }; b.xvc = { state: "closed" };
  log(b.id, "info", `Lease released ${b.id}`);
}

/* ---------- identity ---------- */
function clashWith(b) {
  if (!b.hub) return null;
  for (const o of Object.values(S.boards)) if (o !== b && o.hub && o.mac === b.mac) return o.id;
  return null;
}
const idLeft = (b) => Math.max(0, Math.ceil((b.idUntil - Date.now()) / 1000));
function startIdentify(b, secs) {
  b.idUntil = Date.now() + secs * 1000;
  log(b.id, "info", `Identify ${b.id}: front panel blinks for ${secs} s`);
}
function stopIdentify(b) { b.idUntil = 0; }
function healthDot(b) { return b.readFail ? "warn" : clashWith(b) ? "warn" : "ok"; }

/* ---------- attention ---------- */
function attentionFor(b) {
  const a = [];
  const c = clashWith(b);
  if (c) {
    if (b.macSrc.startsWith("image default")) {
      a.push({ lvl: "err", strong: `Identity clash with ${c}.`, text: ` This board reports ${c}'s MAC ${b.mac}; its label "${b.label}" is the image default. Two boards with one MAC break the hub's DHCP and the panel.`,
        act: "Fix identity…", fn: () => openModal({ kind: "fixid", board: b.id }) });
    } else {
      a.push({ lvl: "err", strong: `Identity clash with ${c}.`, text: ` ${c} reports this board's MAC ${b.mac}. The fix belongs on ${c}: its identity was never set.`,
        act: `Go to ${c}`, fn: () => { S.selected = c; } });
    }
  }
  if (b.readFail) a.push({ lvl: "warn", strong: `Last read failed ${b.readFail.at}:`, text: ` ${b.readFail.text}. Values below may be ${"2"} min old.`, act: "Read again", fn: () => readAgain(b) });
  if (b.kind === "linux" && !b.ssh && canDrive(b)) a.push({ lvl: "warn", strong: "SSH not claimed.", text: " Anyone with the image's default key can log in to this board's Linux. Claim it with your key.", act: "Claim on Board", fn: () => { b.tab = "board"; } });
  if (b.hub && b.lease && b.lease.kind === "yours" && b.lease.min <= 10) a.push({ lvl: "warn", strong: `Your lease ends in ${dur(b.lease.min)}.`, text: ` At ${hhmm(nowS() + b.lease.min * 60)} Program, Reset DUT and debug stop working here; ${b.design} stays loaded.`, act: "Close board…", fn: () => openModal({ kind: "close", board: b.id }) });
  return a;
}
function readAgain(b) {
  b.reading = true;
  setTimeout(() => up(() => {
    b.reading = false; b.lastRead = hhmm(nowS());
    if (b.readFail) { b.readFail = null; log(b.id, "ok", `Read OK ${b.id} (0.1 s): the earlier failure has cleared`); }
    toast(`${b.id} read again: all fresh`);
  }), 700);
}
function lastErrorFor(id) { return S.log.find((r) => r.board === id && (r.lvl === "err" || r.lvl === "warn")); }

/* ---------- programming ---------- */
function preflight(b, o) {
  const r = [];
  r.push({ lvl: o.only && o.only !== b.static ? "err" : "ok", text: `same shell ${hex(b.static)}` });
  r.push({ lvl: "ok", text: `rm_id ${hex(o.rm)}` });
  r.push({ lvl: "ok", text: `${o.kib} KiB fits` });
  if (b.hub) {
    const L = b.lease;
    if (L.kind === "yours") r.push({ lvl: "ok", text: "lease yours" });
    else r.push({ lvl: "err", text: L.kind === "free" ? "no lease" : L.kind === "other" ? `lease: your ${L.job} session` : `lease held by ${L.holder}` });
  }
  if (o.name === b.design) r.push({ lvl: "warn", icon: "info", text: "loaded now: Program reloads it" });
  if (o.ila) r.push({ lvl: "info", icon: "scan-search", text: `${o.ila.length} ILAs` });
  if (o.kit) r.push({ lvl: "info", icon: "file-cog", text: o.kit });
  return r;
}
function startProgram(b, o, restore = false) {
  const hadDbg = b.debug.state === "up", hadX = b.xvc.state === "open";
  b.debug = { state: "down", closedForSwap: hadDbg }; b.xvc = { state: "closed", closedForSwap: hadX };
  b.armed = false; b.outcome = null;
  b.job = { kind: restore ? "restore" : "program", overlay: o.name, start: Date.now(), ms: b.kind === "linux" ? 3600 : 1700,
    secs: swapSecs(b, o), keep: b.keep && !!b.card && !restore, closed: [hadDbg ? "debug session" : null, hadX ? "XVC" : null].filter(Boolean) };
  pushLine(b, dutConsole(b), `--- ${hhmmss(nowS())} partition swap: ${o.name} ${hex(o.rm)} (by ${ME}) ---`, "sys");
}
function finishProgram(b) {
  const j = b.job; const o = ovl(j.overlay);
  b.design = o.name; b.verified = hhmm(nowS()); b.job = null;
  if (j.keep) b.card.def = o.name;
  b.keep = false;
  const what = j.kind === "restore" ? "Restored baseline: greybox" : `Programmed ${o.name}`;
  b.outcome = { lvl: "ok", text: `${what} ${hex(o.rm)} · verified ${b.verified} · ${j.secs} s` + (j.keep ? " · kept on the card: boots next" : "")
    + (j.closed.length ? ` · ${j.closed.join(" and ")} closed for the swap` : "") };
  log(b.id, "ok", `${j.kind === "restore" ? "Restored baseline (greybox)" : "Programmed " + o.name} on ${b.id} (verified, ${j.secs} s)`, "workbench");
  const c = dutConsole(b);
  if (o.cpu) { pushLine(b, c, BANNER, "ban"); pushLine(b, c, "nanosoc> "); b.hb = 0; }
  else pushLine(b, c, `(${o.name} has no CPU: this console stays quiet)`, "sys");
  if (b.afterJob === "release-close") {
    b.afterJob = null; release(b); closeBoard(b); S.ui.modal = null;
    toast(`${b.id}: baseline restored, lease released, board closed`);
  } else if (b.afterJob === "restore-close") {
    b.afterJob = null; closeBoard(b); S.ui.modal = null; toast(`${b.id}: baseline restored and closed`);
  }
}
function pickForProgram(b, name) {
  b.pick = name; b.armed = false; b.tab = "workbench";
  S.ui.flyout = null; S.ui.combo = null;
  S.ui.flashStrip = Date.now(); S.ui.pulseArm = Date.now();
  toast(`${name} picked: tick Arm, then Program`, "upload");
}
function shortDrive(b) {
  const L = b.lease;
  if (L.kind === "held") return `lease held by ${L.holder} (exit 4)`;
  if (L.kind === "other") return `lease held by your ${L.job} session (exit 4)`;
  return "no lease (exit 4)";
}
function refuse(b, what, reason) {
  if (!canDrive(b)) reason = shortDrive(b);
  log(b.id, "err", `${what} refused on ${b.id}: ${reason}`, "workbench");
  S.ui.flashReason = Date.now();
}

/* ---------- consoles ---------- */
function resetDut(b) {
  const c = dutConsole(b);
  b.resetArmed = false; b.consoleSel = c;
  pushLine(b, c, `--- ${hhmmss(nowS())} DUT reset by ${ME} ---`, "sys");
  log(b.id, "ok", `Reset DUT on ${b.id}`, "workbench");
  if (!hasCpu(b)) { setTimeout(() => up(() => pushLine(b, c, `(${b.design} has no CPU: nothing prints after a reset)`, "sys")), 400); return; }
  b.dutBusy = true;
  setTimeout(() => up(() => pushLine(b, c, "bootrom · stage0 · flash ok · CRC ok")), 450);
  setTimeout(() => up(() => { pushLine(b, c, BANNER, "ban"); pushLine(b, c, "nanosoc> "); b.hb = 0; b.dutBusy = false; }), 1050);
}
function sendLine(b) {
  const t = b.sendText.trim(); const c = b.consoleSel;
  if (!t) return;
  const prompt = c === "shell" ? "shell> " : "nanosoc> ";
  pushLine(b, c, prompt + t, "echo"); b.sendText = "";
  const reply = c === "shell"
    ? ({ help: "commands: help, status, icap, net", status: "harness 1.1.0 · up 3 d 02:11 · 0 errors", icap: "nanosoc_ila 0x01000002 · verified 11:02", net: "192.168.1.50 up 100/FD" }[t] || `${t}: unknown command (try help)`)
    : !hasCpu(b) ? null
    : ({ help: "commands: help, ver, mem, eth", ver: "nanosoc M0 · build 2026-09-25", mem: "IMEM 64 KiB ok · DMEM 64 KiB ok", eth: "ETH link up 100/FD · rx 12 tx 9" }[t] || `${t}: unknown command (try help)`);
  setTimeout(() => up(() => { if (reply) { pushLine(b, c, reply); pushLine(b, c, prompt); } else pushLine(b, c, "(no reply: the partition has no CPU)", "sys"); }), 250);
}

/* ---------- board open/close ---------- */
function openBoard(b, take) {
  b.open = true;

  b.tab = S.settings.openOn === "overview" ? "overview" : "workbench";
  log(b.id, "info", `Opened ${b.id}${take ? " and took the lease" : ""}`);
}
function closeBoard(b) {
  b.open = false; b.debug = { state: "down" }; b.xvc = { state: "closed" }; b.armed = false; b.resetArmed = false;

}

/* ---------- timers ---------- */
setInterval(() => {
  let dirty = false;
  for (const b of Object.values(S.boards)) {
    if (b.job) {
      dirty = true;
      if (Date.now() - b.job.start >= b.job.ms) finishProgram(b);
    }
    if (b.idUntil) { dirty = true; if (Date.now() > b.idUntil) b.idUntil = 0; }
    if (b.hv.job) { dirty = true; if (Date.now() - b.hv.job.start >= b.hv.job.ms) finishInstall(b); }
    if (b.fixJob) { dirty = true; if (Date.now() - b.fixJob.start >= 2600) finishFix(b); }
    if (b.checks.run && !b.checks.run.done) { dirty = true; if (Date.now() - b.checks.run.start >= 6000) { b.checks.run.done = true; log(b.id, "ok", `Checks ${b.checks.run.id} iteration 1 PASS 13/13 (${b.id}); next at ${b.checks.run.next}`, "checks"); } }
  }
  if (dirty) up();
}, 200);
setInterval(() => up(() => {
  for (const b of Object.values(S.boards)) {
    if (!hasCpu(b) || b.job || b.dutBusy) continue;
    b.hb += 1; pushLine(b, dutConsole(b), `[${String(b.hb).padStart(4, "0")}] heartbeat: DUT alive`);
  }
}), 5000);
setInterval(() => up(() => {
  for (const b of Object.values(S.boards)) {
    const L = b.lease; if (!L || !L.min) continue;
    L.min = Math.max(1, L.min - 1);
  }
}), 60000);

  const bad = m.done === "refused";

  const foot = m.done === "ok"

        <span class="secondary">${c.kind === "receipt" ? "build receipt" : c.kind === "zip" ? "zip" : "folder"}${c.size ? " · " + fmtBytes(c.size) : ""}</span>
        <span class="mono small muted" style="overflow-wrap:anywhere">${c.src}</span></div>` : null}
    <div>
      <div class="strip-label" style="margin-bottom:6px">What Harness Manager checks before it accepts</div>
      <ul class="imp-checks">${rows.map((r, i) => {
        const st = r.state || (m.running && i === m.i ? "run" : "");
        return html`<li class=${st}>${I(st === "ok" ? "circle-check" : st === "err" ? "circle-x" : st === "run" ? "loader-circle" : st === "skip" ? "circle-minus" : "circle-dashed")}
          <span class="t">${r.t}</span><span class="d">${st === "skip" ? "not checked: refused above" : r.d}</span></li>`; })}</ul>
    </div>
    ${m.done === "ok" ? html`<div class="outcome ok" role="status">${I("circle-check")}<span>Imported <b>${m.name}</b> <span class="mono">${hex(c.rm)}</span> · ${c.kib} KiB into the overlay store.
        It is in the picker tagged <span class="tag imp">imported</span> and picked on the Workbench: tick Arm, then Program.</span></div>` : null}
    ${bad ? html`<div class="outcome err" role="alert">${I("circle-x")}<span><b>Refused</b> ${m.shellBad ? html`<span class="exit-code">exit 14 INCOMPATIBLE</span>` : null}

          Rebuild it against this board's kit (Build tab, kit <span class="mono">${bdKit(b).id}</span>)${where.length ? html`, or import it on ${where.join(", ")}, which runs ${hex(c.static)}` : ""}.`
          : html` ${c.name} is not a kit-built overlay: the folder has no manifest.json, partial.bin and clearing.bin. Nothing was imported.`}</span></div>` : null}
    ${cli ? html`<div><div class="small muted" style="margin-bottom:4px">The same from a shell</div><${CopyRow} text=${cli} label="Import command copied" /></div>` : null}
  <//>`;
}

function lcdRows(b) {
  const W = 40;
  const idl = idLeft(b) > 0;
  const rows = [];
  const row = (cls, ...segs) => {
    let len = segs.reduce((n, s) => n + s[0].length, 0);
    if (len < W) segs.push([" ".repeat(W - len), ""]);
    rows.push({ cls, segs });
  };
  const L = b.lease;
  if (idl) row("banner", [" IDENTIFY: " + ME, ""]);
  else {
    const left = " " + (b.label || b.id.toUpperCase());
    const right = `${b.kind === "linux" ? "linux" : "bm"} ${b.harness} `;
    row("title", [left, ""], [" ".repeat(Math.max(1, W - left.length - right.length)), ""], [right, "l"]);
  }
  row("", ["", ""]);
  row("", ["IP     ", "l"], [b.ip, ""], ["  UP 100/FD", "ok"]);
  if (b.hub) {
    if (L.kind === "yours") row("", ["LEASE  ", "l"], [`david ${pdur(L.min)}`, "acc"]);
    else if (L.kind === "held") row("", ["LEASE  ", "l"], [`${L.holder} ${pdur(L.min)}${L.req ? " +" + L.req : ""}`, "held"]);
    else if (L.kind === "other") row("", ["LEASE  ", "l"], [`david ${L.job} ->${L.until}`, "held"]);
    else row("", ["LEASE  ", "l"], ["free", "ok"]);
  } else row("", ["LEASE  ", "l"], ["no hub", "dim"]);
  if (b.job) {
    const pct = Math.min(99, Math.round(((Date.now() - b.job.start) / b.job.ms) * 100));
    row("", ["DESIGN ", "l"], [b.job.overlay.padEnd(18), ""], [`PROG ${pct}%`, "acc"]);
  } else row("", ["DESIGN ", "l"], [ovl(b.design).name.padEnd(18), ""], [`OK ${b.verified}`, "ok"]);
  row("", ["SHELL  ", "l"], [hex(b.static), ""]);
  row("", ["CARD   ", "l"], [b.card ? `${b.card.def || "greybox"} [A] os ${b.card.booted}*` : b.kind === "linux" ? "none (netboot)" : "config SD only", b.card ? "" : "dim"]);
  row("", ["TEMP   ", "l"], [`${b.temp.toFixed(1)} C`, ""]);
  row("", ["DUT    ", "l"], hasCpu(b) ? [`RUNNING  uart0 76800`, "ok"] : [`no CPU (${b.design})`, "dim"]);
  row("", ["", ""]); row("", ["", ""]); row("", ["", ""]);
  const w = b.watchers[0];
  row("", ["HM     ", "l"], [w ? `${w.who} watching` : "nobody watching", w && w.you ? "acc" : ""]);
  row("", ["", ""]);
  const spin = "|/-\\"[Math.floor(Date.now() / 500) % 4];
  const mac = ` MAC ${b.mac}`;
  row("title", [mac, "l"], [" ".repeat(W - mac.length - 5), ""], [`hb ${spin} `, "l"]);
  return rows;
}

      ${x.tier ? html`<${Btn} cls="primary" icon="refresh-cw" onClick=${() => { x.tier = null; toast(`Vivado ${k.rel} starts (licence tier CORE): covers the xcku115`, "circle-check"); }}>Licence set: check again<//>`
        : html`<${Btn} cls="ghost" icon="refresh-cw" onClick=${() => toast("Setup checked again: target, tools and kit ready")}>Check again<//>`}
    </div>
  <//>`;
}

function BdGenerics({ x, d, edit, locked }) {
  if (x.src === "example") return html`<span class="small muted">none: ${d.name} has no parameters</span>`;
  const st = (g) => (!g.path ? null : bdExists(g.v)
    ? html`<span class="bd-gen-st ok">${I("circle-check")}found</span>` : html`<span class="bd-gen-st err">${I("circle-x")}no file</span>`);
  if (x.src === "paste") return d.gens.length
    ? html`<div class="bd-gens">${d.gens.map((g) => html`<div class="bd-gen-ro"><span class="mono">${g.k}</span><span class="muted">=</span><span class="mono">${g.path ? `{"path": "${g.v}"}` : g.v}</span>${st(g)}</div>`)}
        <div class="small muted">From the pasted design's build.generics: edit the JSON to change them.</div></div>`
    : html`<span class="small muted">none in the design (build.generics)</span>`;
  return html`<div class="bd-gens">
    ${x.gens.map((g, i) => html`<div class="bd-gen">
      <input class="input sm mono" aria-label="Generic name" placeholder="NAME" value=${g.k} disabled=${locked} onInput=${(e) => edit(() => (g.k = e.target.value))} />
      <select class="select sm" aria-label="File or value" disabled=${locked} onChange=${(e) => edit(() => (g.path = e.target.value === "path"))}>
        <option value="path" selected=${g.path}>file</option><option value="value" selected=${!g.path}>value</option></select>
      <input class="input sm mono" aria-label="Value" placeholder=${g.path ? "~/rtl/my_soc/fw/image.hex" : "1"} value=${g.v} disabled=${locked} onInput=${(e) => edit(() => (g.v = e.target.value))} />
      ${st(g) || html`<span></span>`}
      <button type="button" class="btn ghost icon-only sm" title="Remove" disabled=${locked} onClick=${() => edit(() => x.gens.splice(i, 1))}>${I("x")}</button></div>`)}
    <div class="row" style="gap:8px">
      <button type="button" class="btn xs" disabled=${locked} onClick=${() => edit(() => x.gens.push({ k: "", path: false, v: "" }))}>${I("plus")}Add a generic</button>
      ${x.gens.some((g) => g.k === "IMEM_MEM_FPGA_IMG") ? null : html`<button type="button" class="link small" disabled=${locked}
        onClick=${() => edit(() => x.gens.push({ k: "IMEM_MEM_FPGA_IMG", path: true, v: `${d.folder || "~/rtl/my_soc"}/fw/hello_image.hex` }))}>Add nanosoc's firmware image</button>`}
    </div>
    <div class="small muted">Top-level parameters (build.generics), one -generic each. A file, such as the image a SoC's IMEM loads with $readmemh, is written absolute; a missing one stops the build at preflight.</div>
  </div>`;
}

function BdDesignStep({ b, f }) {
  const { x, d } = f;
  const locked = !!(x.run && !x.receipt);
  const edit = (fn) => up(() => { fn(); if (x.designDone || x.written) bdReset(b); });
  const choice = (e) => html`<label class=${"choice" + (x.ex === e.name ? " on" : "")}>
    <input type="radio" name=${"bd-ex-" + b.id} checked=${x.ex === e.name} disabled=${locked} onChange=${() => edit(() => (x.ex = e.name))} />
    <span><b class="mono">${e.name}</b>${e.co ? html` <span class="tag">constraints only</span>` : null}<span class="sub">${e.title}</span></span></label>`;
  let src;
  if (x.src === "example") src = html`<div class="bd-choices" role="radiogroup" aria-label="Examples">
      ${BD_EX.filter((e) => !e.co).map(choice)}
      <div class="bd-choices-sep">Constraints only: ports and timing, they need your RTL</div>
      ${BD_EX.filter((e) => e.co).map(choice)}</div>`;
  else if (x.src === "rtl") src = html`<div class="stack" style="gap:8px">
      <div class="field bd-field"><label for=${"bd-rtl-" + b.id}>RTL folder or .f list</label>
        <input id=${"bd-rtl-" + b.id} class="input mono grow" placeholder="~/rtl/my_soc  or  ~/rtl/my_soc/files.f" value=${x.rtl} disabled=${locked}
          onInput=${(e) => edit(() => (x.rtl = e.target.value))} /></div>
      <div class="field bd-field"><label for=${"bd-name-" + b.id}>Name</label>
        <input id=${"bd-name-" + b.id} class="input mono" style="width:220px;max-width:100%" placeholder=${d.name} value=${x.name} disabled=${locked}
          onInput=${(e) => edit(() => (x.name = e.target.value))} /><span class="small muted">the overlay's name in Program</span></div>
      ${d.todo ? html`<${Reason}>${d.todo}<//>` : d.err ? null : html`<${Reason} lvl="ok">Found ${d.what}; top <span class="mono">${d.top}</span>: 47 ports / 148 bits, the partition's. Harness Manager writes <span class="mono">${d.design}</span> from it: check the compile order.<//>`}
    </div>`;
  else src = html`<div class="stack" style="gap:6px">
      <textarea class="input mono bd-json" rows="11" aria-label="Design JSON" disabled=${locked} value=${x.paste} onInput=${(e) => edit(() => (x.paste = e.target.value))}></textarea>
      <div class="small muted">A pasted design lives only in this page; paths are relative to where you save it. The format: USER_GUIDE §7.2.</div></div>`;
  return html`<${BdPanel} f=${f} k="design" title="Your design">
    <p class="bd-lead">Pick what to build: an example, the folder with your RTL, or a design .json. Everything about the design is here, in one place.</p>
    ${d.err ? html`<${BdFix} e=${d.err} />` : null}
    <div class="seg bd-seg" role="group" aria-label="Design source">${[["example", "Example", "list"], ["rtl", "My RTL", "file-code"], ["paste", "Paste .json", "copy"]].map(([k2, l, ic]) =>
      html`<button type="button" aria-pressed=${x.src === k2 ? "true" : "false"} disabled=${locked} onClick=${() => edit(() => (x.src = k2))}>${I(ic)}${l}</button>`)}</div>
    ${src}
    <dl class="kv bd-kv">
      ${x.src === "rtl" ? null : html`<dt>Name</dt><dd class="mono">${d.name}</dd>`}
      <dt>rm_id</dt><dd><div class="line"><span class="mono">${hex(d.rm)}</span>${d.proposed ? html`<span class="chip accent">proposed by HM</span>` : html`<span class="chip">from the design</span>`}</div>
        ${d.proposed ? html`<div class="sub">User designs take 0x8000-0xFFFF; the same name proposes the same id on every machine.${x.src !== "example" ? ` Harness Manager writes "rm_id": "${hex(d.rm)}" into the design to keep it.` : ""}</div>` : null}</dd>
      <dt>Sources</dt><dd class="small">${d.what}</dd>
      <dt>Generics</dt><dd><${BdGenerics} x=${x} d=${d} edit=${edit} locked=${locked} /></dd>
    </dl>
    ${d.warn.map((w) => html`<${Reason} lvl="warn">${w}<//>`)}
    ${locked ? html`<${Reason}>Vivado is building ${d.name} now: the design stays as it is until that build ends.<//>` : null}
    <div class="bd-acts">
      ${x.designDone ? html`<span class="chip ok">${I("circle-check")}Chosen</span><span class="small muted">Changing anything here starts the build again.</span>`
        : html`<${Btn} cls="primary" icon="chevron-right" dis=${!!d.err || !!d.todo} onRefused=${() => toast(d.err ? `Refused: ${d.err.title}` : d.todo, "circle-x")}
          onClick=${() => { x.designDone = true; x.view = null; }}>Continue to Build<//>`}
      <${Btn} icon="download" onClick=${() => toast(`Saved ${d.name}_rm_kit.zip: wrapper skeleton, out-of-context XDC, connectivity sheet, pblock facts`, "download")}>Download the RM kit (wrapper + XDC)<//>
    </div>
    <details class="bd-more"><summary>More exports</summary>
      <div class="small secondary">Full-board XDC: every MPS3 pin and IO standard, for a whole-FPGA design that replaces the harness.
        <button type="button" class="link" onClick=${() => up(() => toast("Saved mps3_full_board_xdc.zip", "download"))}>Export full-board XDC</button></div></details>
    <${BdThen}>Build writes build_rm.tcl for ${d.name}; you run Vivado yourself (30-60 min).<//>
  <//>`;
}

function BdBuildStep({ b, f }) {
  const { x, d, k, run } = f;
  const st = f.steps[2].state;
  if (st === "blocked") return html`<${BdPanel} f=${f} k="build" title="Build">
    <p class="bd-lead">Waits for Design: pick what to build first. Then Harness Manager writes build_rm.tcl and gives you the Vivado command.</p>
    <div class="bd-acts"><${Btn} icon="chevron-right" onClick=${() => (x.view = null)}>Go to Design<//></div><//>`;
  const cmd = bdCmd(b, d, x);
  if (!x.written) return html`<${BdPanel} f=${f} k="build" title="Write the build directory">
    <p class="bd-lead">Harness Manager writes <span class="mono">build_rm.tcl</span>, the kit and the XDC kit for <b>${d.name}</b> into one folder. Nothing runs yet.</p>
    <div class="field bd-field"><label for=${"bd-dir-" + b.id}>Build directory</label>
      <input id=${"bd-dir-" + b.id} class="input mono grow" value=${d.dir} onInput=${(e) => up(() => (x.dir = e.target.value))} /></div>
    <div class="field bd-field"><label for=${"bd-jobs-" + b.id}>Threads</label>
      <select id=${"bd-jobs-" + b.id} class="select" onChange=${(e) => up(() => (x.jobs = e.target.value))}>${["2", "4", "8"].map((n) => html`<option value=${n} selected=${x.jobs === n}>${n}</option>`)}</select>
      <span class="small muted">4-8 GB of RAM either way</span></div>
    <${Reason}>Paths are on srv03335: harness-manager-daemon runs there, and Vivado will too. To build on another machine, download the folder as a zip.<//>
    <div class="bd-acts"><${Btn} cls="primary" icon="file-code" onClick=${() => bdWrite(b)}>Write the build directory<//>
      <${Btn} cls="ghost" icon="download" onClick=${() => toast(`Saved ${d.name}_build.zip: build_rm.tcl, the XDC kit and the kit`, "download")}>Download as a zip<//></div>
    <${BdThen}>you run one Vivado command (30-60 min); Harness Manager watches the folder.<//>
  <//>`;
  if (!x.receipt && !run) return html`<${BdPanel} f=${f} k="build" title="Run Vivado: 30-60 min">
    <div class="bd-note">${I("info")}<span><b>Harness Manager doesn't run Vivado.</b> You run it in a shell on srv03335. Harness Manager watches <span class="mono">${d.dir}</span> and moves on by itself when the receipt appears; you can close this page meanwhile.</span></div>
    <ol class="bd-howto">
      <li><b>Copy the command and run it.</b>
        <div class="bd-cmd"><code title=${cmd}>${cmd}</code><${Btn} cls="primary sm" icon="copy" onClick=${() => copyText(cmd, "Vivado command copied")}>Copy<//></div>
        <div class="sub">The full path of Vivado ${k.rel}, the kit's release, whatever is first on PATH.</div></li>
      <li><b>Leave it running.</b> <span class="sub">A small RM takes about 30 min on a quiet machine and up to an hour on a loaded one; a nanosoc-sized RM about 50. 4-8 GB of RAM.</span></li>
      <li><b>Come back to Check.</b> <span class="sub">Harness Manager reads the receipt, checks it and says what's next.</span></li>
    </ol>
    <div class="bd-watch"><span class="dot accent bd-blink"></span>Watching <span class="mono">${d.dir}</span> · no build_rm.log yet</div>
    <${BdExpect} d=${d} />
    <div class="bd-acts"><${BdSim} b=${b} /><span class="grow"></span>
      <${Btn} cls="ghost sm" icon="file-code" onClick=${() => { x.written = false; }}>Change the folder<//></div>
  <//>`;
  if (!x.receipt) return html`<${BdPanel} f=${f} k="build" title=${`Vivado is building ${d.name}`}>
    <div class="bd-wait">
      <div><div class="bd-clock num">${run.mm} min ${p2(run.ss)} s</div><div class="small muted">since ${hhmm(x.run.startS)} · typical about ${d.mins} min</div></div>
      <div class="stack" style="gap:6px;min-width:0"><${BdStages} at=${run.idx} />
        <div class="small secondary">build_rm.log: last <span class="mono">HM_STAGE ${run.stage}</span>${run.sub ? html` (<span class="mono">${run.sub}</span>)` : null}, written ${run.logAt}</div></div>
    </div>
    <${Reason} lvl="warn">Don't start a second Vivado in ${d.dir}: it would overwrite out/. Harness Manager offers no command while this one runs.<//>
    <${BdExpect} d=${d} />
    <details class="bd-more"><summary>The command it runs</summary><div style="margin-top:6px"><${CopyRow} text=${cmd} label="Vivado command copied" /></div></details>
    <div class="bd-acts"><${BdSim} b=${b} started=${true} /></div>
    <${BdThen}>when the receipt appears, Harness Manager checks it (about 3 s) and shows the verdict.<//>
  <//>`;
  const r = x.receipt;
  const ok = r.state === "passed";
  return html`<${BdPanel} f=${f} k="build" title=${`Vivado finished ${r.name} · ${r.mins} min`}>
    <div class=${"bd-verdict " + (ok ? "ok" : "err")} title="The last line of build_rm.log that starts with HM_RM_BUILD_">${ok
      ? `HM_RM_BUILD_COMPLETE rm=${r.name} rm_id=${hex(r.rm)} static_id=${hex(r.static)}` : `HM_RM_BUILD_FAILED gate=${r.gate}`}</div>
    <p class="bd-lead">${ok ? "The receipt says passed." : `The receipt says failed at ${r.stage}.`} build_rm.log has ${r.warns} CRITICAL WARNINGs: expected, not failures. Check has the verdict in full.</p>
    <div class="bd-acts"><${Btn} cls="primary" icon="chevron-right" onClick=${() => (x.view = "check")}>See the check<//></div>
  <//>`;
}

function BdGroup({ g }) {
  const ic = { ok: "circle-check", err: "circle-x", skip: "circle-dashed" }[g.st];
  return html`<div class=${"bd-group " + g.st}><div class="bd-group-h">${I(ic)}<span>${g.l}</span>
    ${g.exit ? html`<span class="chip err bd-mini">${g.exit}</span>` : null}</div><div class="bd-group-d">${g.d}</div></div>`;
}
function BdCheckStep({ b, f }) {
  const { x, d, fi } = f;
  const r = x.receipt;
  if (!r) return html`<${BdPanel} f=${f} k="check" title="Check">
    <p class="bd-lead">Waits for Build. When Vivado finishes, Harness Manager reads the receipt and checks it here, board-free: identity, timing, pr_verify and the files.</p><//>`;
  if (x.check === "running" || !x.check) return html`<${BdPanel} f=${f} k="check" title=${`Checking ${r.name}`}>
    <${Reason} lvl="busy">Reading the receipt, its files and the partial/clearing pair (kit check, about 3 s)…<//><//>`;
  const groups = bdGroups(b);
  const at = r.state === "passed" ? 6 : BD_STAGES.indexOf(r.stage);
  return html`<${BdPanel} f=${f} k="check" title=${fi ? `Check: refused` : `Check: passed`}>
    ${fi ? html`<div class="bd-fail" role="alert">
        <div class="bd-fail-h">${I("circle-x")}<span>Refused: ${fi.title}</span></div>
        <div class="small secondary">One gate failed: <span class="mono">${fi.gate}</span> at ${fi.stage}${fi.exit ? html` · <span class="chip err bd-mini">${fi.exit}</span>` : null}${fi.showDetail ? html`. ${fi.detail}` : null}</div>
        <div class="small"><b>Fix:</b> ${fi.fix}</div>
        ${fi.cmd ? html`<${CopyRow} text=${fi.cmd} label="export copied" />` : null}
        <div class="bd-acts"><${Btn} cls="primary" icon="refresh-cw" onClick=${() => bdRedo(b, fi)}>${fi.act}<//>
          ${fi.why ? html`<${Btn} cls="ghost sm" icon="copy" onClick=${() => copyText(`harness-manager kit guide --why ${fi.gate}`, "Command copied")}>kit guide --why ${fi.gate}<//>` : null}</div>
      </div>`
      : html`<div class="outcome ok">${I("circle-check")}<span><b>Passed:</b> ${r.name} <span class="mono">${hex(r.rm)}</span> for <span class="mono">${hex(r.static)}</span> · ${r.gates} gates (${r.gates - 1} PASS + 1 NOTE) · checked ${x.check.at}</span></div>`}
    <div class="bd-sect">Stages</div>
    <${BdStages} at=${Math.min(at, 6)} failed=${r.state !== "passed"} />
    <div class="bd-sect">Checks</div>
    <div class="bd-groups">${groups.map((g) => html`<${BdGroup} g=${g} />`)}</div>
    ${fi ? null : html`<${Reason}>1 unchecked: static_binding (a partial carries no static identity). Unchecked is not a pass, and it doesn't block.<//>
        <div class="bd-acts"><${Btn} cls="primary" icon="chevron-right" onClick=${() => (x.view = null)}>Go to Add<//></div>`}
    <div class="small muted">Receipt <span class="mono">${d.dir}/out/${r.name}_build.json</span> · ${r.warns} CRITICAL WARNINGs in the log: expected · the same as <span class="mono">harness-manager kit check ${d.dir}</span></div>
  <//>`;
}

function BdAddStep({ b, f }) {
  const { x } = f;
  const r = x.receipt;
  const st = f.steps[4].state;
  if (st === "blocked") return html`<${BdPanel} f=${f} k="add" title="Add to the Workbench">
    <p class="bd-lead">Waits for a passed check. Adding makes the build an overlay (kit pack --import) and opens the Workbench with it picked.</p><//>`;
  const L = b.lease;
  const lease = !b.hub ? html`<${Reason} lvl="ok">No lease needed: ${b.id} is on this network, not behind a hub.<//>`
    : L.kind === "yours" ? html`<${Reason} lvl="ok">Programming needs the lease: yours · ${dur(L.min)}.<//>`
    : L.kind === "held" ? html`<${Reason} lvl="held">Programming needs the lease: ${L.holder} holds ${b.id} for ${dur(L.min)}. Adding doesn't: add it now, then
        <button type="button" class="link" onClick=${() => up(() => openModal({ kind: "request", board: b.id, msg: `Could I have ${b.id} to program ${r.name} when you are done?`, need: "30 min" }))}>request the board</button>.<//>`
    : L.kind === "other" ? html`<${Reason} lvl="held">Programming needs the lease: your ${L.job} session holds it until ${L.until}. Adding doesn't.<//>`
    : html`<${Reason}>Programming needs the lease: nobody holds it. Acquire it in the header when you get there.<//>`;
  if (x.added) return html`<${BdPanel} f=${f} k="add" title=${`${r.name} is on the Workbench`}>
    <div class="outcome ok">${I("circle-check")}<span><b>${r.name}</b> <span class="mono">${hex(r.rm)}</span> is in ${b.id}'s designs, picked on the Workbench: tick Arm, then Program.</span></div>
    ${lease}
    <div class="bd-acts"><${Btn} cls="primary" icon="wrench" onClick=${() => pickForProgram(b, r.name)}>Open the Workbench<//>
      <${Btn} cls="ghost" icon="plus" onClick=${() => { bdReset(b); x.view = null; x.demo = "none"; }}>Build another design<//></div>
  <//>`;
  return html`<${BdPanel} f=${f} k="add" title=${`Add ${r.name} to the Workbench`}>
    <div class="bd-recap">${I("circle-check")}<span>Check passed: <b>${r.name}</b> <span class="mono">${hex(r.rm)}</span> for <span class="mono">${hex(r.static)}</span> · ${r.gates} gates</span>
      <span class="bd-recap-g">${bdGroups(b).map((g) => html`<span class="chip ok bd-mini">${I("check")}${g.l}</span>`)}</span></div>
    <p class="bd-lead">Adding writes the overlay (a manifest, the partial and its clearing) from the receipt and puts it in ${b.id}'s designs, as <span class="mono">kit pack --import</span> does. The Workbench opens with ${r.name} picked: tick Arm, then Program (${b.kind === "linux" ? "35-80 s on Linux" : "3-7 s on bare metal"}).</p>
    <div class="bd-acts"><${Btn} cls="primary" icon="upload" busy=${x.adding} onClick=${() => bdAdd(b)}>Add to the Workbench and program…<//></div>
    ${lease}
    <${BdThen}>on the Workbench, Arm → Program; the console shows it boot.<//>
  <//>`;
}

function BdFoot({ b, f }) {
  const { x, d } = f;
  const des = x.src === "example" ? d.design : x.src === "rtl" ? d.design : `${d.name}.json`;
  return html`<div class="bd-foot">
    <details class="card bd-fold"><summary>${I("chevron-right")}The same on the command line</summary>
      <div class="bd-fold-body">${[`harness-manager kit script ${b.ip} --design ${des} --out ${d.dir} --jobs ${x.jobs}`, `harness-manager kit build ${d.dir}`,
        `harness-manager kit check ${d.dir} ${b.ip}`, `harness-manager kit pack ${d.dir} --import`].map((c) => html`<${CopyRow} text=${c} label="Command copied" />`)}
        <div class="small muted">kit build prints the Vivado command; it never runs Vivado. kit guide ${b.ip} --design ${des} shows these steps' states.</div></div></details>
    <details class="card bd-fold"><summary>${I("chevron-right")}Every build gate and its fix (${BD_GATES.length})</summary>
      <div>${BD_GATES.map(([g, t]) => html`<details class="trouble"><summary>${I("chevron-right")}${g}</summary><p>${t}</p></details>`)}</div></details>
  </div>`;
}

setInterval(() => {
  let dirty = false;
  for (const b of Object.values(S.boards)) {
    const x = b.build;
    if (!x || !x.v2 || !x.run || x.receipt) continue;
    if (nowS() - x.run.startS >= bdDesign(b).mins * 60) { bdFinish(b); dirty = true; }
    else if (S.selected === b.id && b.open && b.tab === "build") dirty = true;
  }
  if (dirty) up();
}, 1000);

function BuildTab({ b }) {
  const f = bdFlow(b);
  const { x, cur, view } = f;
  const vs = f.steps.find((s) => s.k === view);
  const Panel = { setup: BdSetup, design: BdDesignStep, build: BdBuildStep, check: BdCheckStep, add: BdAddStep }[view];
  const phase = `${b.id}:${view}:${x.written ? 1 : 0}${x.run ? 1 : 0}${x.receipt ? 1 : 0}${x.check && x.check !== "running" ? 1 : 0}`;
  const top = useRef(null);
  useEffect(() => { const el = top.current && top.current.closest(".section-body"); if (el) el.scrollTop = 0; }, [phase]);
  return html`<div class="bd" ref=${top}>
    <section class="card bd-head" aria-label="Build progress">
      <div class="bd-top"><span class="bd-title">${I("file-cog")}Build a design for ${b.id}</span>
        <span class="small muted bd-tagline">from your RTL to a design on the Workbench</span>
        <label class="bd-demo" title="Prototype only: jump the flow to a failure, as if you had got there">
          <span class="tag">Demo</span>
          <select class="select" aria-label="Demo: make it fail" onChange=${(e) => up(() => bdDemo(b, e.target.value))}>
            ${BD_FAILS.map(([k2, l]) => html`<option value=${k2} selected=${x.demo === k2}>${l}</option>`)}</select>
          <button type="button" class="btn ghost icon-only xs" title="Start over at Design" onClick=${() => up(() => bdDemo(b, "none"))}>${I("rotate-ccw")}</button>
        </label></div>
      <${BdStepper} f=${f} />
      <${BdWhere} f=${f} />
      <${BdReady} b=${b} f=${f} />
      ${bdLeaseNote(b)}
    </section>
    ${cur && view !== cur.k ? html`<div class="bd-viewing">${I("eye")}<span>You are looking at <b>${vs.l}</b>; the current step is <b>${cur.l}</b>.</span>
      <${Btn} cls="sm" icon="chevron-right" onClick=${() => (x.view = null)}>Back to ${cur.l}<//></div>` : null}

function Recover({ b }) {

  if (r.busy && r.busy.job && !(b.job && b.job.kind === "restore")) { r.out = { k: "greybox", lvl: "ok", text: b.outcome ? b.outcome.text : "Restored greybox" }; r.busy = null; }
  const why = (s) => s.no || (s.guard && guard) || (!drive ? "needs the lease" : null);
  const can = steps.filter((s) => !why(s)).map((s) => s.sev);
  const cannot = steps.filter((s) => s.no && (s.k === "power" || s.k === "reboot"));
  return html`<${Card} title="Recover" icon="power" cls="bt-o2 rc" sub="Start at the top and stop at the first step that brings the board back. Each step down clears more." bodyCls="flush">
    <div class="rc-head">

      ${guard ? html`<${Reason} lvl="warn">Restart, reboot and power-cycle wait: ${guard}<//>` : null}
    </div>
    <ol class="rc-list">${steps.map((s) => {
      const w = why(s); const armed = r.armed === s.k;
      const busy = (r.busy && r.busy.k === s.k) || (s.k === "greybox" && b.job && b.job.kind === "restore");
      const out = r.out && r.out.k === s.k ? r.out : null;
      let prog = null;
      if (busy && s.k === "greybox" && b.job) prog = [Math.min(99, Math.round(((Date.now() - b.job.start) / b.job.ms) * 100)), `Swapping to greybox · ${b.job.secs} s on the board`];
      else if (busy && r.busy.t0) { const f = Math.min(1, (Date.now() - r.busy.t0) / r.busy.real); prog = [Math.round(f * 100), `${s.k === "restart" ? "Restarting" : "Rebooting"} · ${Math.round(f * r.busy.sim)} s of ~${r.busy.sim} s`]; }
      return html`<li class=${"rc-row" + (w ? " off" : "") + (armed ? " armed" : "")} data-sev=${s.sev}>
        <span class="rc-rung" title=${`Step ${s.sev} of 5`}>${s.sev}</span>
        <div class="rc-main">
          <div class="rc-top"><span class="rc-t">${s.t}</span>
            <span class="rc-sev" title=${`Severity ${s.sev} of 5`}>${[1, 2, 3, 4, 5].map((n) => html`<i class=${n <= s.sev ? "on" : ""}></i>`)}</span>
            <span class="chip plain rc-time" title="Typical time">${I("timer")}${s.time}</span></div>
          <div class="rc-d">${s.d}</div></div>
        <div class="rc-acts">
          <${Arm} on=${armed} dis=${!!w || busy} set=${(x) => (r.armed = x ? s.k : null)} />
          <${Btn} cls="sm" dis=${!!w || !armed} busy=${busy} onRefused=${() => (w && !drive && !s.no ? refuse(b, s.t, driveReason(b)) : null)} onClick=${() => recRun(b, s)}>${s.t}<//></div>
        <div class="rc-keeps" aria-label="What this step keeps">${KEEP_COLS.map(([c, lbl]) => html`<${KeepCell} col=${lbl} v=${s.keep[c]} />`)}</div>
        ${s.note && !s.no ? html`<div class="rc-extra"><${Reason}>${s.note}<//></div>` : null}
        ${s.no ? html`<div class="rc-extra"><${Reason} lvl=${s.k === "greybox" ? "" : "warn"}>${s.no}${s.fix ? " Fix: " + s.fix : ""}${s.fix ? html` <button class="link" onClick=${() => up(() => { const el = document.querySelector(".bt-o1"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); })}>See Connections</button>` : null}<//></div>` : null}
        ${prog ? html`<div class="rc-extra progress-box"><div class="meter-line"><span>${prog[1]}</span><span class="num">${prog[0]}%</span></div><div class="meter"><div style=${{ width: prog[0] + "%" }}></div></div></div>` : null}
        ${out && !busy ? html`<div class="rc-extra"><div class=${"outcome " + out.lvl}>${I("circle-check")}<span>${out.text}</span></div></div>` : null}

function CloseModal({ m }) {
  const b = S.boards[m.board];
  const yours = b.hub && b.lease.kind === "yours"; const loaded = b.design !== "greybox";
  const opts = [];
  if (yours) {
    opts.push({ k: "restore", t: "Restore baseline, release and close", s: loaded ? `Loads greybox (~40 s), gives the lease back to the hub, closes ${b.id}. The next person finds a clean board.` : "greybox is loaded already", dis: !loaded || !!b.job });
    opts.push({ k: "release", t: "Release and close", s: loaded ? `Leaves ${b.design} loaded. The lease goes back to the hub now.` : "The lease goes back to the hub now." });
    opts.push({ k: "keep", t: "Close and keep the lease", s: `The lease runs out by itself in ${dur(b.lease.min)}.` });
  } else if (!b.hub) {
    opts.push({ k: "close", t: "Close", s: `Leaves ${b.design} loaded. This board has no hub lease.` });
    if (loaded) opts.push({ k: "restoreclose", t: "Restore baseline and close", s: "Loads greybox (~5 s), then closes.", dis: !!b.job });
  } else {
    opts.push({ k: "close", t: "Close the board", s: b.lease.kind === "held" ? `The lease stays with ${b.lease.holder}.${b.lease.req ? " Your request stays in the queue." : ""}` : b.lease.kind === "other" ? `Your ${b.lease.job} session keeps the lease.` : "Nobody holds the lease." });
  }
  const def = yours ? (loaded && !b.job ? "restore" : "release") : "close";
  const ch = m.choice || def;
  const running = !!m.running;
  const confirm = () => {
